["tl-church",1975,"Church Committee","cia","m-capitol","A Senate investigation into intelligence abuses that exposed MKUltra, the CIA's ties to journalists, and other secret programs."],
["tl-tesla",1901,"Tesla: Talking with the Planets",null,"m-teslacs","In a 1901 Collier's Weekly article, Nikola Tesla wrote that the regular signals he had picked up at his Colorado Springs lab in 1899 were probably messages from another planet. Later researchers suggest he heard natural radio noise or, possibly, Marconi's transmissions.","civ"],
["tl-marconi",1920,"Marconi's mystery signals",null,null,"In 1920 Guglielmo Marconi, the radio pioneer, said his stations had picked up unexplained long-wavelength signals that might come from another world, possibly Mars. Skeptics noted that only his own stations heard them, and they were likely natural or earthly interference.","civ"],
["tl-radiosilence",1924,"Listening for Mars","navy",null,"When Mars passed unusually close to Earth in August 1924, Amherst astronomer David Todd campaigned for a National Radio Silence Day so receivers could listen for Martian signals. The Navy and Army reportedly told their radio stations to monitor for anything unusual. Nothing credible was heard."],
["tl-nine",1952,"Puharich and the Nine",null,"m-roundtable","At his Round Table Foundation in Maine, Andrija Puharich held sessions with an Indian medium who said he channeled the Nine, a council of higher beings. The same year Puharich briefed the Pentagon on ESP as a possible psychological warfare tool."],
["tl-oberth54",1954,"Oberth backs flying saucers",null,null,"Hermann Oberth, a founder of rocket science, told reporters in Germany that flying saucers were real and probably came from another star system, piloted by beings far ahead of humanity. A year later he joined Wernher von Braun's Army rocket team in Huntsville."],
["tl-cahn",1952,"Aztec story exposed",null,"m-aztec","Reporter J.P. Cahn's article in True magazine showed that the sources behind the Aztec crash story, Silas Newton and Leo GeBauer, were con men selling fake oil-detecting devices. The pair were later convicted of fraud.","civ"],
["tl-5412",1955,"5412 Committee created","nsc5412",null,"National Security Council directive 5412/2, signed under President Eisenhower in December 1955, created a small panel of senior officials to approve CIA covert operations."],
["tl-darpa",1958,"ARPA founded","darpa",null,"Created in February 1958, months after the Soviet Sputnik launch, to keep the U.S. ahead in advanced technology. Renamed DARPA in 1972."],
["tl-ford66",1966,"Congress's first UFO hearing","armed","m-capitol","After the Air Force's J. Allen Hynek suggested some Michigan sightings were \"swamp gas,\" House Minority Leader Gerald Ford of Michigan called for a hearing. The House Armed Services Committee met on April 5, 1966, and the Air Force soon funded the University of Colorado study led by Edward Condon."],
["tl-symp68",1968,"House UFO symposium","congress","m-capitol","On July 29, 1968, the House Committee on Science and Astronautics held a one-day Symposium on Unidentified Flying Objects, chaired by Rep. J. Edward Roush, with scientists including J. Allen Hynek, James McDonald, and Carl Sagan."],
["tl-geller",1974,"SRI psychic tests in Nature","stargate",null,"Physicists Russell Targ and Harold Puthoff published their tests of Uri Geller and others at Stanford Research Institute in the journal Nature. The SRI work led to the government's remote viewing programs, later known as Stargate. Critics faulted the experiments' controls.","civ"],
["tl-roswell78",1978,"Roswell revived",null,"m-roswell","Retired Air Force officer Jesse Marcel, who handled the 1947 debris, told nuclear physicist and UFO researcher Stanton Friedman he believed it was not from Earth. Friedman's research and the 1980 book The Roswell Incident made Roswell the most famous UFO case.","civ"],
["tl-oumuamua",2017,"'Oumuamua",null,null,"In October 2017 astronomers spotted the first known object passing through the solar system from interstellar space. Harvard astronomer Avi Loeb argued its odd shape and acceleration could mean it was alien technology; most astronomers favor a natural explanation.","civ"],
["tl-galileo",2021,"Galileo Project launched",null,null,"In July 2021 Avi Loeb launched a Harvard-based project to search for technological objects near Earth with dedicated telescopes and cameras, publishing results openly.","civ"],
["tl-disclosureact",2023,"UAP Disclosure Act","congress","m-capitol","In July 2023 Senators Chuck Schumer and Mike Rounds proposed a law to declassify UAP records, with an independent review board and power to take possession of recovered material. In the final FY2024 defense bill the House stripped the review board and those powers, but a UAP Records Collection at the National Archives was created."],
["tl-sol",2023,"Sol Foundation founded",null,null,"Stanford pathologist Garry Nolan and anthropologist Peter Skafish founded a research and policy center on UAP in August 2023, holding its first symposium at Stanford that November.","civ"],
["tl-aaroannual",2024,"AARO annual report","aaro",null,"AARO's fiscal year 2024 consolidated annual report, released in November 2024, counted 757 new UAP reports received from May 2023 to June 2024. Most cases resolved so far were balloons, birds, drones, or satellites, and many others lacked enough data to analyze."],
["tl-bsc",1940,"British Security Coordination opens",null,"m-bsc","Winston Churchill's government sent William Stephenson to New York to run Britain's secret intelligence operations in the Americas from Rockefeller Center."],
["tl-hearing24",2024,"Second House UAP hearing","oversight","m-capitol","On November 13, 2024, House Oversight subcommittees heard from former officials and journalist Michael Shellenberger, whose report alleging a hidden UAP data program called Immaculate Constellation was entered into the record by Rep. Nancy Mace. The Pentagon denies the program exists."],
["tl-konablue",2024,"Kona Blue revealed","aaro",null,"AARO's 2024 historical report disclosed Kona Blue, a program proposed to the Department of Homeland Security around 2011 to reverse-engineer recovered UAP technology. AARO said it was never approved because no such technology existed to study."],
["tl-cero",1992,"CERO founded",null,null,"Hypnotherapist Yvonne Smith started the Close Encounter Resource Organization in the Los Angeles area to support people who report alien abductions, with group meetings and hypnosis sessions. Some sources give 1991.","civ"],
["tl-coverup88",1988,"UFO Cover-Up? Live!",null,null,"A two-hour syndicated TV special, hosted by Mike Farrell and aired October 14, 1988, that brought Majestic 12 and Area 51 stories to a mass audience. Two disguised informants called Falcon and Condor described captured aliens who liked strawberry ice cream. Researchers later identified Falcon as Air Force agent Richard Doty, who has given conflicting accounts."],
["tl-moore89",1989,"Bill Moore's confession","mj12",null,"At the July 1989 MUFON symposium in Las Vegas, researcher Bill Moore said he had spent years cooperating with Air Force intelligence agents, including Richard Doty, who were feeding disinformation to UFO researchers, and that he had reported on fellow researchers in return for access. He said the insiders called themselves the Aviary, using bird codenames. The admission damaged trust in the Majestic 12 papers he had helped circulate."],
["tl-hearing22",2022,"First UAP hearing in decades","intel","m-capitol","On May 17, 2022, a House Intelligence subcommittee held the first public congressional hearing on UFOs since 1966. Deputy Under Secretary of Defense Ronald Moultrie and Deputy Director of Naval Intelligence Scott Bray showed new video and said most cases had ordinary explanations, while some remained unexplained."],
["tl-gofast25",2025,"AARO's GoFast analysis","aaro","m-gimbal","In February 2025, AARO published its analysis of the 2015 GoFast video. It concluded the object was about 13,000 feet up, not skimming the water, and was drifting with the wind at ordinary speeds, with the apparent speed coming from the jet's own motion (parallax). AARO said it could not identify the object itself."],
["tl-hearing25",2025,"UAP whistleblower hearing","oversight","m-capitol","On September 9, 2025, a House Oversight task force chaired by Rep. Anna Paulina Luna held a hearing on UAP transparency and whistleblower protection. Military witnesses described sightings, and Rep. Eric Burlison played a video of a Hellfire missile appearing to strike an orb off Yemen in 2024. The Pentagon did not comment on the video."],
["tl-pursue",2026,"PURSUE files released","pursue",null,"On May 8, 2026, following a presidential directive, the Department of War launched WAR.GOV/UFO and its first release of UAP files under PURSUE. Further batches followed roughly monthly. They include Apollo-era records, military infrared videos, and FBI witness interviews. Most are previously unreleased and many lack context."],
["tl-aaro25",2026,"AARO FY2025 report","aaro",null,"Released in July 2026, months late, AARO's report on June 2024 to May 2025 counted 319 new reports and resolved 114 of them, plus 256 older cases, mostly as balloons, birds, drones, aircraft and satellites. New satellite analysis explained 238 cases as sunlight flashing off satellites. AARO said nothing it resolved pointed to alien or advanced foreign technology, but about 200 reports remain unexplained, mostly for lack of data."],
["tl-apro",1952,"APRO founded",null,"m-apro","Jim and Coral Lorenzen founded the Aerial Phenomena Research Organization in Sturgeon Bay, Wisconsin. It moved to Tucson in 1960, ran field investigations with a network of scientific consultants, and lasted until 1988, making it one of the longest-running civilian UFO groups.","civ"],
["tl-bennewitz",1980,"The Bennewitz affair","af","m-kirtland","Albuquerque physicist Paul Bennewitz told Kirtland Air Force Base that he had filmed lights and recorded signals he believed came from alien craft. Instead of dismissing him, Air Force Office of Special Investigations agents, including Richard Doty, with help from researcher Bill Moore, fed him fake documents and stories, apparently to steer attention away from classified work at the base. He came to believe in an alien base at Dulce and suffered a breakdown in the mid-1980s."],
["tl-starfish",1962,"Starfish Prime","dod","m-johnston","On July 9, 1962, a 1.4-megaton warhead launched from Johnston Atoll exploded about 400 km (250 miles) above the Pacific, the largest nuclear test ever conducted in space. Its electromagnetic pulse knocked out about 300 streetlights and set off burglar alarms in Hawaii, 1,450 km away. The artificial radiation belts it created disabled six or more satellites over the following months, including Telstar 1 and Britain's Ariel 1. Some UAP researchers link these tests to Harald Malmgren's claim of a 1962 shootdown; the tests are documented, the shootdown is not."],
["tl-bluegill",1962,"Bluegill Triple Prime","dod","m-johnston","The fourth attempt at the Bluegill high-altitude test, after a rocket failure, a launch-pad explosion that spread plutonium on Johnston Atoll, and another failed launch. It detonated a warhead officially described as submegaton, believed to be about 400 kilotons, about 48 km (30 miles) above Johnston Island on October 26, 1962, during the Cuban Missile Crisis. Films of the blast later became the center of a claim that it knocked down a UFO."],
["tl-rand23",2023,"RAND maps UAP reports","rand",null,"RAND's study Not the X-Files analyzed 101,151 public UAP reports made to the National UFO Reporting Center from 1998 to 2022 and found sightings were more common within about 30 km of military operations areas. It suggested many reports may be authorized military flights and recommended outreach to nearby residents."],
["tl-serpo",2005,"Project Serpo emails","mj12",null,"Anonymous emails to a UFO discussion group run by Victor Martinez described Project Serpo, an alleged secret exchange in which twelve U.S. military personnel traveled to a planet called Serpo in the Zeta Reticuli system between 1965 and 1978. The story echoed one Air Force agent Richard Doty had offered journalist Linda Moulton Howe in 1983. No evidence has ever been produced.","civ"],
["tl-prasad",2019,"Deep Prasad's abduction account",null,null,"Canadian technology entrepreneur Deep Prasad said that sometime between 2017 and 2019 he was taken aboard a craft by non-human beings in an experience he compared to a kundalini awakening, and that it turned him toward UFO research. The account rests on his own statements and has not been independently verified.","civ"],
["tl-l9",1977,"The Ellsworth L-9 document","af","m-ellsworth","A document said to come from a FOIA request describes an intruder alarm at Ellsworth's L-9 missile launch facility on November 16, 1977, where security airmen met figures in glowing suits and a hovering craft. It has long been considered a hoax: MUFON's Bob Pratt exposed it in 1984, researchers cite its spelling and technical errors, and it is strongly suspected to be a fabrication by Richard Doty, who was stationed at Ellsworth then."],
["tl-woods",2026,"Ellsworth guards go public","af","m-ellsworth","On the American Alchemy podcast, former Air Force security policemen Mario Woods and Michael Johnson said that while guarding a nuclear missile site at Ellsworth in 1977 they lost hours of time after alarms tripped, and woke miles away near Newell Reservoir. The episode tied their story to the L-9 document. Their account is unverified.","civ"],
["tl-sputnik",1957,"Sputnik 1 launched",null,null,"The Soviet Union put the first artificial satellite into orbit on October 4, 1957. A month later came the November 1957 sighting wave, including Levelland, Texas, and from then on satellites, rocket bodies and re-entries became a steady source of UFO reports.","tech"],
["tl-www",1991,"The World Wide Web goes public",null,null,"Tim Berners-Lee's web opened to the whole internet in August 1991. UFO documents, FOIA releases and claims could now spread without publishers or newsletters, from early fan sites to the 2005 Serpo emails.","tech"],
["tl-facebook",2004,"Facebook launches",null,null,"Facebook launched in February 2004. Its groups and shared videos became a main channel for sighting reports, and for viral hoaxes, outside the old network of UFO clubs and newsletters.","tech"],
["tl-youtube",2005,"YouTube and Reddit launch",null,null,"YouTube launched in February 2005 and Reddit in June 2005. Video sharing turned every clip into a public exhibit, and Reddit's r/UFOs grew into one of the busiest places where sightings, leaks and debunks are argued over.","tech"],
["tl-twitter",2006,"Twitter launches",null,null,"Twitter, renamed X in 2023, launched in 2006. Journalists, whistleblowers and members of Congress now often break UAP news there first, and claims can travel faster than they can be checked.","tech"],
["tl-iphone",2007,"The iPhone goes on sale",null,null,"Apple's iPhone went on sale in June 2007, and smartphones soon put a camera in almost every pocket. Skeptics point out that clear UFO photos did not become common as a result; small phone lenses tend to turn distant lights at night into blurry blobs.","tech"],
["tl-drones",2013,"Camera drones go mainstream",null,"m-njdrones","DJI's Phantom, released in January 2013, helped turn camera drones into a mass-market product. Drones are now a common explanation in AARO's case resolutions, and they were at the center of the late-2024 New Jersey drone sightings.","tech"],
["tl-openai",2015,"OpenAI founded",null,null,"OpenAI was founded in December 2015 as an artificial intelligence research lab. Its later tools, and those of its rivals, changed how images, documents and claims are made and how they have to be checked.","tech"],
["tl-starlink",2019,"First Starlink satellites launched",null,null,"SpaceX launched its first 60 Starlink satellites in May 2019. The \"trains\" of bright moving dots that followed set off waves of UFO reports, and AARO's FY2025 report explained 238 cases as sunlight flashing off satellites.","tech"],
["tl-chatgpt",2022,"ChatGPT released",null,null,"ChatGPT's release on November 30, 2022 brought AI to the mainstream. Together with image generators, it made convincing fake photos, documents and testimony cheap to produce, raising the bar for checking any new UAP evidence.","tech"],
["tl-sora",2024,"AI video arrives",null,null,"OpenAI previewed Sora, a model that makes video from text prompts, in February 2024. With realistic AI video, a striking clip is no longer evidence by itself; the original file, its provenance, and other witnesses or sensors matter more.","tech"],
["tl-fermi",1950,"Fermi asks \"Where is everybody?\"",null,"m-losalamos","Over lunch at Los Alamos in 1950, physicist Enrico Fermi asked colleagues including Edward Teller why, if intelligent life is common, there was no sign of it. The \"Fermi paradox\" became a central puzzle for the search for extraterrestrial intelligence. In 1981 Frank Tipler argued that because no self-replicating \"von Neumann probes\" have been seen, no other civilizations exist; Carl Sagan and William Newman disputed his reasoning.","civ"],
["tl-smithmemo",1950,"Wilbert Smith's flying saucer memo",null,"w-magnet","Canadian radio engineer Wilbert Smith wrote that U.S. scientist Robert Sarbacher told him Americans believed flying saucers were real, and that their study, led by Vannevar Bush, was more highly classified than the hydrogen bomb. The November 1950 memo stayed Top Secret in Canada until 1969 and led to Project Magnet. No U.S. record confirms what Sarbacher said."],
["tl-tunguska",1908,"The Tunguska explosion",null,"w-tunguska","On June 30, 1908, a huge blast over the Siberian forest flattened trees across more than 2,000 square km. Scientists attribute it to a meteor or comet fragment exploding in the air. A 1946 short story by Soviet writer Alexander Kazantsev imagined it as the nuclear explosion of a spaceship from Mars, and the idea became a lasting UFO legend.","uap"],
["tl-dyatlov",1959,"Dyatlov Pass deaths",null,"w-dyatlov","Nine Soviet hikers died on a mountain in the northern Urals after cutting their way out of their tent at night. Some had serious injuries, and hikers to the south reported orange spheres in the sky, which fed theories about secret weapons and UFOs. A Russian inquiry reopened in 2019 concluded in 2020 that an avalanche most likely drove them out into the cold.","uap"],
["tl-zond4",1968,"Zond 4 re-entry",null,null,"On the night of March 3, 1968, hundreds of people from Kentucky to Pennsylvania saw a procession of fiery objects, which NORAD identified as pieces of the Soviet Zond 4 launch falling back to Earth. A few witnesses described a cigar-shaped craft with a row of lighted windows, and the Condon Report used the case to show how a known event can be misperceived.","uap"],
["tl-goddard69",1969,"Air Marshal Goddard's UFO talk",null,null,"Retired RAF Air Marshal Sir Victor Goddard told an audience at Caxton Hall in London that UFOs might come from an invisible, paraphysical world rather than from other planets. Writer John Keel quoted the talk in his 1970 book Operation Trojan Horse.","civ"],
["tl-redstar",1975,"Charlie Redstar",null,"w-carman","Through the spring and summer of 1975, people around Carman, Manitoba, reported a red ball of light that came to be called Charlie Redstar. Crowds gathered in fields to watch for it, and the sightings were part of a wave of UFO reports across Canada that year.","uap"],
["tl-falconbridge",1975,"CFS Falconbridge radar sighting",null,"w-falconbridge","On November 11, 1975, staff at the Canadian radar station near Sudbury, Ontario, tracked and watched a brilliantly lit circular object that climbed from 42,000 to 72,000 feet over 14 minutes, according to a NORAD message to Canada's National Research Council. Police in the area also reported sightings. Suggested explanations included Venus, clouds and balloons.","mil"],
["tl-setka",1978,"Soviet UFO program begins",null,"w-petrozavodsk","After the 1977 Petrozavodsk sighting, the Soviet Defense Ministry and Academy of Sciences began a secret study of UFO reports known as Setka, or the Network. By 1990 it had looked at about 3,000 cases and explained roughly 90 percent as rocket launches, balloons and other human activity.","gov"],
["tl-yukon96",1996,"Yukon mothership sighting",null,"w-foxlake","On the night of December 11, 1996, at least 31 people at Fox Lake, Carmacks, Pelly Crossing and Mayo in the Yukon reported a huge craft with rows of lights, which one called the size of a football stadium. Satellite analyst Ted Molczan later matched it to a Soviet rocket stage falling back to Earth that evening.","uap"],
["tl-hellyer",2005,"Ex-defence minister backs UFOs",null,"w-stpaul","Paul Hellyer, Canada's defence minister in the 1960s, said publicly that he believed UFOs were real, and later urged governments to disclose alien technology. He became one of the most senior former officials to make such claims.","civ"],
["tl-mj12",1984,"Majestic 12 papers surface","mj12",null,"Documents claiming a secret 1947 UFO committee began circulating in the 1980s. The FBI later concluded they were fake."],
["tl-nyt",2017,"AATIP revealed","aatip",null,"In December 2017, The New York Times reported on the Pentagon's secret UFO program and published two Navy videos."],
["tl-videos",2020,"Navy videos released","navy",null,"In April 2020, the Pentagon officially released the FLIR1, Gimbal, and GoFast videos."],
["tl-odni",2021,"ODNI preliminary assessment","odni","m-odni","The June 2021 report reviewed 144 military UAP reports and could explain only one."],
["tl-hearing",2023,"House UAP hearing","oversight","m-capitol","In July 2023, David Grusch, Ryan Graves, and David Fravor testified before the House Oversight Committee."],
["tl-bsra",1945,"BSRA founded",null,"m-bsra","Meade Layne founded Borderland Sciences Research Associates in San Diego to study psychic and \"borderland\" phenomena. After 1947 it became an early voice for the idea that flying saucers came from another plane of existence.","civ"],
["tl-nsa47",1947,"National Security Act","dod","m-pentagon","Signed by President Truman in July 1947, it created the CIA, the National Security Council, and an independent Air Force, and joined the services under a single defense establishment that became the Department of Defense in 1949."],
["tl-winterhaven",1952,"Project Winterhaven proposed",null,null,"T. Townsend Brown proposed a military research program to develop electrogravitic propulsion, based on his high-voltage experiments. It was not adopted."],
["tl-nicap",1956,"NICAP founded",null,"m-nicap","The National Investigations Committee on Aerial Phenomena, a civilian UFO research group, was founded in Washington with T. Townsend Brown as its first director. Donald Keyhoe led it from 1957 to 1969.","civ"],
["tl-lazar",1989,"Bob Lazar goes public",null,"m-area51","Bob Lazar told Las Vegas TV reporter George Knapp that he had worked on alien spacecraft at a site called S-4 near Area 51. His claims have never been verified.","civ"],
["tl-disclosure",2001,"Disclosure Project press conference",null,null,"In May 2001, Steven Greer's Disclosure Project held a press conference at the National Press Club in Washington with former military and government witnesses who called for UFO hearings.","civ"],
["tl-ttsa",2017,"To The Stars Academy launches","aatip",null,"In October 2017, musician Tom DeLonge launched To The Stars Academy of Arts and Science with Harold Puthoff, Chris Mellon, and Luis Elizondo. In December it helped publicize two Navy UAP videos alongside The New York Times' AATIP story.","civ"],
["tl-malmgren",2025,"Harald Malmgren interview",null,"w-malmgren","Weeks before his death in February 2025, former trade official Harald Malmgren told interviewer Jesse Michels that he had handled debris from a craft shot down in 1962 and seen evidence of non-human beings. His claims are unverified and disputed.","civ"],
["tl-aaroreport",2024,"AARO historical report","aaro",null,"AARO's March 2024 Historical Record Report, Volume 1, found no evidence of extraterrestrial technology or hidden reverse-engineering programs."]];

var PEOPLE=[
{id:"pp-brown",t:"T. Townsend Brown",a:"Thomas Townsend Brown, TT Brown",s:"Physicist and inventor, 1905 to 1985",d:["An American physicist who claimed that high-voltage capacitors produce a thrust he linked to gravity. The effect is named the Biefeld-Brown effect, after him and Denison University physics professor Paul Alfred Biefeld; most physicists attribute it to ion wind.","He worked for the Navy in the 1930s and during World War II, including research on minesweeping. In 1952 he proposed Project Winterhaven, a military program to develop electrogravitic propulsion, which was not adopted.","In 1956 he helped found NICAP, the leading civilian UFO group of its era, and was briefly its first director. His work is often cited in claims about secret antigravity research, but no such program has been confirmed."],
 L:[["tree","navy","Worked for the Navy in the 1930s and during World War II"],["map","m-denison","Began his high-voltage experiments with Paul Alfred Biefeld"],["map","m-nicap","First director of NICAP"],["timeline","tl-winterhaven","Proposed Project Winterhaven"],["timeline","tl-nicap","Helped found NICAP"]]},
{id:"pp-scully",t:"Frank Scully",a:"Frank J. Scully",s:"Variety columnist and author, 1892 to 1964",d:["A columnist for the show business paper Variety who wrote the 1950 bestseller Behind the Flying Saucers, which introduced the Aztec, New Mexico, crash story.","His sources turned out to be con men, and the book damaged his reputation, though he stood by it."],L:[["map","m-aztec","The Aztec crash story"],["timeline","tl-b-scully","Wrote Behind the Flying Saucers"],["timeline","tl-cahn","His sources exposed, 1952"]]},
{id:"pp-leir",t:"Roger Leir",a:"Roger K. Leir, Dr. Leir",s:"Podiatrist and author, 1935 to 2014",d:["A California podiatrist who, starting in 1995, surgically removed small objects from people who reported alien abductions and promoted them as alien implants.","His 1999 book The Aliens and the Scalpel described the surgeries. His claims have not been independently verified."],L:[["timeline","tl-b-leir","Wrote The Aliens and the Scalpel"]]},
{id:"pp-ford",t:"Gerald Ford",a:"Gerald R. Ford",s:"House Minority Leader, later President, 1913 to 2006",d:["As a Michigan congressman he called the Air Force's \"swamp gas\" explanation for 1966 sightings in his state \"flippant\" and pushed for Congress's first UFO hearing."],L:[["timeline","tl-ford66","Pushed for the 1966 hearing"],["tree","armed","House Armed Services held it"]]},
{id:"pp-mcdonald",t:"James McDonald",a:"James E. McDonald",s:"Atmospheric physicist, 1920 to 1971",d:["A University of Arizona physicist who became the leading scientific voice arguing UFOs deserved serious study. He testified at the 1968 House symposium and criticized both Blue Book and the Condon Report."],L:[["timeline","tl-symp68","Testified at the 1968 symposium"],["tree","bluebook","Criticized Project Blue Book"]]},
{id:"pp-friedman",t:"Stanton Friedman",a:"Stanton T. Friedman",s:"Nuclear physicist and UFO researcher, 1934 to 2019",d:["Worked on nuclear propulsion projects before devoting himself to UFO research. His 1978 interview with Jesse Marcel restarted the Roswell story, and he later championed the Majestic 12 papers as authentic."],L:[["timeline","tl-roswell78","Revived Roswell in 1978"],["map","m-roswell","Roswell"],["tree","mj12","Defended the MJ-12 papers"]]},
{id:"pp-loeb",t:"Avi Loeb",a:"Abraham Loeb",s:"Harvard astronomer",d:["A Harvard astrophysicist who argued that the interstellar object 'Oumuamua could be alien technology, and who leads the Galileo Project's search for technological objects near Earth."],L:[["timeline","tl-oumuamua","Proposed an artificial origin"],["timeline","tl-galileo","Leads the Galileo Project"]]},
{id:"pp-nolan",t:"Garry Nolan",a:"Garry P. Nolan",s:"Stanford pathologist",d:["A Stanford immunologist who has studied people with injuries attributed to UAP encounters and analyzed materials said to come from them. Co-founder of the Sol Foundation."],L:[["timeline","tl-sol","Co-founded the Sol Foundation"]]},
{id:"pp-schumer",t:"Chuck Schumer",a:"Charles Schumer",s:"U.S. Senator from New York",d:["Senate Majority Leader who, with Senator Mike Rounds of South Dakota, introduced the 2023 UAP Disclosure Act. Much of it was stripped from the final bill."],L:[["timeline","tl-disclosureact","Co-sponsored the UAP Disclosure Act"],["tree","nara","Created the UAP Records Collection"]]},
{id:"pp-rounds",t:"Mike Rounds",a:"",s:"U.S. Senator from South Dakota",d:["Republican co-sponsor of the 2023 UAP Disclosure Act with Chuck Schumer, and a continued advocate for UAP records disclosure."],L:[["timeline","tl-disclosureact","Co-sponsored the UAP Disclosure Act"]]},
{id:"pp-swann",t:"Ingo Swann",a:"",s:"Artist and psychic, 1933 to 2013",d:["A New York artist tested at Stanford Research Institute in the early 1970s. He helped develop the techniques and coined the term \"remote viewing\" used in the government's psychic spying programs."],L:[["tree","stargate","Helped develop remote viewing"],["timeline","tl-geller","Tested at SRI"]]},
{id:"pp-geller",t:"Uri Geller",a:"",s:"Performer and self-described psychic",d:["An Israeli performer famous for spoon bending. Russell Targ and Harold Puthoff tested him at SRI in 1972 and 1973 and reported results in Nature in 1974. Magicians and skeptics have argued his feats are stage tricks."],L:[["timeline","tl-geller","Tested at SRI"]]},
{id:"pp-coyne",t:"Lawrence Coyne",a:"Larry Coyne",s:"Army Reserve helicopter pilot",d:["Commanded the helicopter in the 1973 Mansfield, Ohio encounter and filed the crew's official report."],L:[["map","m-coyne","The Coyne helicopter incident"],["timeline","tl-e-m-coyne","1973"]]},
{id:"pp-bledsoe",t:"Chris Bledsoe",a:"Christopher Bledsoe",s:"North Carolina UFO experiencer and author",d:["A former home builder from Hope Mills, North Carolina, who says a 2007 encounter on the Cape Fear River healed his Crohn's disease and began years of contact with orbs and beings. He says the experiences are tied to his Christian faith and to certain dates such as Easter.","He wrote UFO of God (2023) and has been featured in documentaries and podcasts. He says scientists, a general, and members of Congress have visited him, including NASA mission controller Tim Taylor. His claims are unverified, and critics question the circle of officials around him."],L:[["map","m-bledsoe","The 2007 Cape Fear encounter"],["timeline","tl-b-bledsoe","Wrote UFO of God"],["timeline","tl-e-m-bledsoe","2007"]]},
{id:"pp-ttaylor",t:"Tim Taylor",a:"Timothy Taylor",s:"NASA mission controller",d:["A NASA mission controller, Taylor appears prominently in Diana Walsh Pasulka's 2019 book American Cosmic and is closely tied to Chris Bledsoe, whom he has visited and studied. He has claimed involvement with military and intelligence programs and has said he briefed senior officials on UAP.","UNVERIFIED: his claimed military and intelligence work and briefings have not been independently confirmed, and some researchers have criticized how readily they have been accepted. Not to be confused with Travis Taylor, the engineer who served as chief scientist for the Pentagon's UAP Task Force."],L:[["timeline","tl-b-cosmic","Featured in American Cosmic"],["map","m-bledsoe","Works with Chris Bledsoe"]]},
{id:"pp-strieber",t:"Whitley Strieber",a:"Louis Whitley Strieber",s:"Novelist and abduction experiencer",d:["A horror novelist (The Wolfen, The Hunger) whose 1987 book Communion described being taken by beings he called \"the visitors\" from his New York cabin in December 1985. It became a No. 1 bestseller and was made into a 1989 film.","He has written many more books on his experiences and hosts the long-running Dreamland podcast. His claims are unverified; skeptics point to sleep paralysis."],L:[["map","m-strieber","His 1985 experience"],["timeline","tl-b-communion","Wrote Communion"],["timeline","tl-b-superanatural","Co-wrote The Super Natural"]]},
{id:"pp-kripal",t:"Jeffrey Kripal",a:"Jeffrey J. Kripal",s:"Religion scholar at Rice University",d:["A historian of religion who studies paranormal and anomalous experiences, and who co-wrote The Super Natural with Whitley Strieber."],L:[["timeline","tl-b-superanatural","Co-wrote The Super Natural"]]},
{id:"pp-chall",t:"Charles Hall",a:"Charles James Hall",s:"Former Air Force weather observer",d:["Says that as a young Air Force weather observer in Nevada in the mid-1960s he repeatedly met tall, pale beings he calls the \"Tall Whites,\" and wrote about them in his Millennial Hospitality books.","UNVERIFIED: his service details and encounters have not been independently confirmed."],L:[["map","m-hall","Where he says the encounters happened"],["timeline","tl-b-millennial","Wrote Millennial Hospitality"]]},
{id:"pp-stephenson",t:"William Stephenson",a:"Intrepid, Sir William Stephenson, William Samuel Stephenson",s:"Canadian spymaster, code name Intrepid, 1897 to 1989",d:["A Canadian World War I fighter pilot and inventor-turned-industrialist who ran British Security Coordination in New York during World War II under the code name Intrepid. He worked closely with William Donovan and helped shape the OSS, the forerunner of the CIA.","Ian Fleming, who worked in British naval intelligence, named him as one of the real spies behind James Bond. The 1976 bestseller A Man Called Intrepid made him famous, but historians say it exaggerated his role."],L:[["map","m-bsc","Ran British Security Coordination"],["tree","oss","Helped shape the OSS"],["timeline","tl-bsc","Arrived in New York, 1940"]]},
{id:"pp-donovan",t:"William Donovan",a:"Wild Bill Donovan, William J. Donovan",s:"Founder of the OSS, 1883 to 1959",d:["A World War I Medal of Honor recipient and New York lawyer whom President Roosevelt chose to lead U.S. intelligence. He headed the OSS from 1942 to 1945 and is often called the father of American intelligence."],L:[["tree","oss","Led the OSS"],["map","m-bsc","Worked with William Stephenson"]]},
{id:"pp-shellenberger",t:"Michael Shellenberger",a:"",s:"Journalist",d:["An author and journalist who in 2024 published whistleblower claims about a hidden UAP data program and gave Congress the Immaculate Constellation report."],L:[["tree","immcon","Delivered the report"],["timeline","tl-hearing24","Testified in 2024"]]},
{id:"pp-mace",t:"Nancy Mace",a:"",s:"U.S. Representative from South Carolina",d:["Chaired the House Oversight subcommittee that co-hosted the November 2024 UAP hearing, where she entered the Immaculate Constellation report into the record."],L:[["timeline","tl-hearing24","Led the 2024 hearing"],["tree","immcon","Entered the report"]]},
{id:"pp-mbrown",t:"Matthew Brown",a:"",s:"Former Pentagon official",d:["Identified as the author of the Immaculate Constellation report. He says he came across evidence of the program while working in government. His claims are unverified, and the Pentagon denies the program exists."],L:[["tree","immcon","Wrote the report"]]},
{id:"pp-ysmith",t:"Yvonne Smith",a:"Yvonne R. Smith",s:"Hypnotherapist and abduction researcher",d:["A certified hypnotherapist who began working with trauma clients in the early 1990s and says patterns of alien abduction experiences surfaced in their sessions. She founded the Close Encounter Resource Organization (CERO) as a support group for experiencers, in the tradition of Budd Hopkins and John Mack.","She wrote Chosen, about claimed alien hybrid programs, and Coronado, transcripts of hypnosis sessions with people who reported a shared experience at a 1994 conference at the Hotel del Coronado in San Diego. Critics of hypnotic regression warn that it can create false memories."],L:[["timeline","tl-cero","Founded CERO"],["timeline","tl-woods","Appeared in the 2026 Ellsworth episode"]]},
{id:"pp-doty",t:"Richard Doty",a:"Richard C. Doty",s:"Former Air Force intelligence agent",d:["A special agent with the Air Force Office of Special Investigations at Kirtland Air Force Base in the late 1970s and 1980s. He has acknowledged feeding UFO disinformation to researchers, most notably to Paul Bennewitz, an Albuquerque businessman who had been recording signals near the base and came to believe in an alien underground base at Dulce, New Mexico. The campaign contributed to Bennewitz's breakdown.","Researchers identified him as Falcon, the disguised informant in the 1988 TV special UFO Cover-Up? Live!, and Bill Moore named him as a key contact. He has told shifting stories, sometimes claiming the alien material was real, and appears in the 2013 documentary Mirage Men."],L:[["map","m-kirtland","Stationed at Kirtland AFB"],["timeline","tl-bennewitz","The Bennewitz affair"],["timeline","tl-coverup88","Identified as Falcon"],["timeline","tl-moore89","Named by Bill Moore"],["tree","mj12","Helped spread Majestic 12 material"],["timeline","tl-serpo","Linked to the Project Serpo story"],["timeline","tl-l9","Suspected author of the L-9 document"]]},
{id:"pp-pandolfi",t:"Ron Pandolfi",a:"Ronald Pandolfi",s:"CIA scientist",d:["A physicist in the CIA's Directorate of Science and Technology, described by journalists and researchers as running an informal \"weird desk\" that tracked UFO, paranormal, and exotic-technology claims in the 1990s. He was in contact with researchers, TV producers, and Silicon Valley entrepreneur Joseph Firmage's UFO projects.","UNVERIFIED: Some secondary sources claim he was \"Pelican\" in the Aviary group of insiders, and that he talked about an antigravity device. TV producer Robert Kiviat later sued Firmage, Pandolfi, and others over an unpaid antigravity documentary. None of these claims has been confirmed, and the CIA has not commented."],L:[["tree","cia","CIA Directorate of Science and Technology"],["tree","mj12","Linked to the Aviary insiders"]]},
{id:"pp-basiago",t:"Andrew Basiago",a:"Andrew D. Basiago",s:"Lawyer and time-travel claimant",d:["A Washington state lawyer who says that as a child in the late 1960s and 1970s he took part in a secret DARPA program called Project Pegasus that used teleportation and time travel, and that in the early 1980s he was teleported to Mars, along with a young Barack Obama.","UNVERIFIED: no documents or witnesses support the claims. DARPA has said it has no record of the program, and a White House spokesman denied that Obama had been to Mars. Basiago ran a long-shot campaign for president in 2016."],L:[["tree","darpa","Claims a DARPA program"]]},
{id:"pp-bennewitz",t:"Paul Bennewitz",a:"Paul Frederick Bennewitz",s:"Physicist and businessman, 1927 to 2003",d:["Ran Thunder Scientific Corporation, an electronics firm next to Kirtland Air Force Base in Albuquerque. From 1979 he filmed lights and recorded signals near the base and became convinced they came from alien craft, and reported this to the Air Force in 1980.","Air Force intelligence agents, including Richard Doty, and researcher Bill Moore fed him forged documents and false stories, apparently to protect classified projects at the base. He came to believe in an alien underground base at Dulce, New Mexico, and in a coming invasion, and was hospitalized after a breakdown in the mid-1980s. Greg Bishop's 2005 book Project Beta tells the story."],L:[["timeline","tl-bennewitz","The Bennewitz affair"],["map","m-kirtland","Watched the base"],["map","m-dulce","Originated the Dulce Base story"]]},
{id:"pp-lorenzen",t:"Coral and Jim Lorenzen",a:"Coral Lorenzen, Jim Lorenzen, L. J. Lorenzen",s:"Founders of APRO",d:["Husband-and-wife founders of the Aerial Phenomena Research Organization in 1952. Coral ran the group and wrote several books on UFO sightings and abduction reports, and Jim handled its technical side. APRO ended after Coral's death in 1988."],L:[["timeline","tl-apro","Founded APRO"],["map","m-apro","APRO headquarters"]]},
{id:"pp-tesla",t:"Nikola Tesla",a:"",s:"Inventor, 1856 to 1943",d:["The pioneer of alternating current power, radio, and wireless experiments. In 1899, at his Colorado Springs lab, he recorded faint repeating signals that he believed came from intelligent beings on another planet, and wrote about them in 1901 in \"Talking with the Planets.\"","UNVERIFIED: no evidence shows the signals were artificial. Researchers have suggested natural radio emissions, lightning, or Marconi's transmissions."],L:[["map","m-teslacs","His Colorado Springs lab"],["timeline","tl-tesla","Talking with the Planets"]]},
{id:"pp-marconi",t:"Guglielmo Marconi",a:"",s:"Radio pioneer, 1874 to 1937",d:["The Italian inventor who shared the 1909 Nobel Prize in Physics for wireless telegraphy. In 1920 he said his stations had picked up unexplained signals that might come from another planet, and he is said to have listened for Mars from his yacht Elettra in the early 1920s.","UNVERIFIED: he never claimed actual contact, and the signals were most likely natural or earthly interference."],L:[["timeline","tl-marconi","His 1920 claim"],["timeline","tl-radiosilence","The 1924 listen for Mars"]]},
{id:"pp-puharich",t:"Andrija Puharich",a:"Henry K. Puharich",s:"Physician and parapsychologist, 1918 to 1995",d:["A doctor and inventor who ran the Round Table Foundation in Maine, studying psychics and mind-altering substances. He briefed the Pentagon on ESP in 1952 and served in the Army Medical Corps at the Army Chemical Center in Maryland from 1953 to 1955, where he lectured on ESP research.","Through mediums he claimed contact with the Nine, a group of higher intelligences. He met Uri Geller in Israel in 1971 and brought him to the U.S. for testing at SRI in 1972, and his 1974 book Uri claimed Geller's powers came from extraterrestrial beings. These claims are UNVERIFIED and were widely criticized."],L:[["map","m-roundtable","Round Table Foundation"],["timeline","tl-nine","The Nine"],["tree","army","Army Medical Corps, 1953 to 1955"],["timeline","tl-geller","Brought Uri Geller to the U.S."]]},
{id:"pp-oberth",t:"Hermann Oberth",a:"",s:"Rocket pioneer, 1894 to 1989",d:["A German-Romanian physicist whose 1923 book on rockets into space helped found the field; a young Wernher von Braun assisted his early experiments. He worked on German rockets during World War II and for the U.S. Army in Huntsville from 1955 to 1958.","In 1954 he said publicly that flying saucers were real, probably from another star system, and flown by beings far more advanced than humans. He offered no evidence beyond the sighting reports themselves."],L:[["timeline","tl-oberth54","His 1954 statements"],["map","m-redstone","Redstone Arsenal, 1955 to 1958"],["tree","army","Army rocket team"]]},
{id:"pp-vonbraun",t:"Wernher von Braun",a:"",s:"Rocket engineer, 1912 to 1977",d:["Led Nazi Germany's V-2 rocket program, which used concentration-camp slave labor, then came to the U.S. under Operation Paperclip. His team built the Army's Redstone and Jupiter rockets in Huntsville and, at NASA, the Saturn V that carried Apollo crews to the Moon.","He made no UFO claims himself. Carol Rosin, his spokeswoman in his last years, later said he warned her that an alien threat would one day be invented to justify weapons in space. That claim is UNVERIFIED and rests only on her account."],L:[["tree","paperclip","Brought over in Operation Paperclip"],["map","m-paperclip","His rocket team in Huntsville"],["map","m-bliss","His team's first U.S. base"],["tree","nasa","Director of NASA's Marshall center"]]},
{id:"pp-fort",t:"Charles Fort",a:"Charles Hoy Fort",s:"Writer, 1874 to 1932",d:["An American writer who spent years in libraries collecting reports of anomalies that science ignored, published in The Book of the Damned (1919) and three later books. The word Fortean, for strange phenomena, comes from his name."],L:[["timeline","tl-b-fort","The Book of the Damned, 1919"]]},
{id:"pp-jung",t:"Carl Jung",a:"Carl Gustav Jung, C. G. Jung",s:"Swiss psychiatrist, 1875 to 1961",d:["The founder of analytical psychology, known for ideas such as the collective unconscious and archetypes. Late in life he wrote a book on flying saucers as a modern myth."],L:[["timeline","tl-b-jung","Flying Saucers: A Modern Myth"]]},
{id:"pp-menzel",t:"Donald Menzel",a:"Donald Howard Menzel",s:"Harvard astronomer, 1901 to 1976",d:["A Harvard astronomer and director of the Harvard College Observatory who wrote three popular books arguing that UFOs were misidentified ordinary objects or unusual atmospheric effects."],L:[["timeline","tl-b-menzel","Flying Saucers, 1953"]]},
{id:"pp-klass",t:"Philip Klass",a:"Philip J. Klass, Phil Klass",s:"Aviation journalist and UFO skeptic, 1919 to 2005",d:["A senior editor at Aviation Week who became the most prominent UFO skeptic of the late 20th century, writing several books that offered ordinary explanations for famous cases."],L:[["timeline","tl-b-klass","UFOs Explained, 1974"]]},
{id:"pp-pilkington",t:"Mark Pilkington",a:"",s:"British writer and publisher",d:["A British writer on fringe culture and the publisher of Strange Attractor Press. His book Mirage Men traced how intelligence agencies used UFO stories as cover and disinformation, and he co-produced the 2013 documentary of the same name."],L:[["timeline","tl-b-miragemen","Mirage Men, 2010"],["map","m-kirtland","Kirtland AFB"]]},
{id:"pp-gbishop",t:"Greg Bishop",a:"",s:"Writer and radio host",d:["An American writer and broadcaster on UFOs and fringe history, best known for Project Beta, his account of the Paul Bennewitz affair."],L:[["timeline","tl-b-projectbeta","Project Beta, 2005"],["map","m-kirtland","Kirtland AFB"]]},
{id:"pp-jacobsen",t:"Annie Jacobsen",a:"",s:"Journalist and author",d:["An American investigative journalist who writes histories of secret U.S. military and intelligence programs, including Operation Paperclip, DARPA, Area 51, and government psychic research."],L:[["timeline","tl-b-area51book","Area 51, 2011"],["timeline","tl-b-phenomena","Phenomena, 2017"],["map","m-area51","Area 51"],["tree","stargate","Stargate Project"]]},
{id:"pp-randle",t:"Kevin Randle",a:"Kevin D. Randle",s:"Author and former Air Force officer",d:["A former Army helicopter pilot and Air Force intelligence officer who has written many books on UFOs, especially Roswell, including two with Donald Schmitt."],L:[["timeline","tl-b-crashroswell","UFO Crash at Roswell, 1991"],["map","m-roswell","Roswell"]]},
{id:"pp-schmitt",t:"Donald Schmitt",a:"Donald R. Schmitt, Don Schmitt",s:"UFO researcher",d:["A Wisconsin UFO researcher who co-wrote UFO Crash at Roswell with Kevin Randle and later wrote further books on the case."],L:[["timeline","tl-b-crashroswell","UFO Crash at Roswell, 1991"],["map","m-roswell","Roswell"]]},
{id:"pp-fowler",t:"Raymond Fowler",a:"Raymond E. Fowler",s:"UFO investigator and author",d:["A former NICAP investigator from Massachusetts whose books on Betty Andreasson, beginning with The Andreasson Affair (1979), became some of the most influential abduction accounts."],L:[["timeline","tl-b-andreasson","The Andreasson Affair, 1979"],["map","m-nicap","Investigated for NICAP"]]},
{id:"pp-coulthart",t:"Ross Coulthart",a:"",s:"Australian investigative journalist",d:["An award-winning Australian investigative reporter who turned to UFOs with his 2021 book In Plain Sight, and in 2023 conducted David Grusch's first television interview, for NewsNation."],L:[["timeline","tl-b-inplainsight","In Plain Sight, 2021"],["timeline","tl-hearing","Grusch's 2023 testimony"]]},
{id:"pp-graff",t:"Garrett Graff",a:"Garrett M. Graff",s:"Journalist and historian",d:["An American journalist and historian of national security, whose 2023 book traces how the government has handled UFOs from the 1940s to AARO."],L:[["timeline","tl-b-graff","UFO: The Inside Story, 2023"],["tree","aaro","AARO"]]},
{id:"pp-hancock",t:"Graham Hancock",a:"",s:"British author, born 1950",d:["A former journalist whose books argue that an advanced civilization was lost at the end of the last Ice Age. Archaeologists widely reject his theories as pseudoarchaeology."],L:[["timeline","tl-b-fingerprints","Fingerprints of the Gods, 1995"],["map","a-giza","Giza"],["map","a-tiwanaku","Tiwanaku"],["map","a-gobekli","Göbekli Tepe"]]},
{id:"pp-prasad",t:"Deep Prasad",a:"Deeptanshu Prasad",s:"Technology entrepreneur and UFO researcher",d:["An Indian-born Canadian entrepreneur who studied industrial engineering at the University of Toronto and founded the quantum computing startup ReactiveQ in 2018. He later founded the technology company GenMat.","He says the 2017 Pentagon UFO videos first drew him to the subject, and that sometime between 2017 and 2019 he was taken aboard a craft by non-human beings in an experience he compared to a kundalini awakening. In 2019 he said he wanted to find and reverse-engineer a UFO and backed UAP eXpeditions, a nonprofit searching for UAP off Southern California. His account is UNVERIFIED and rests on his own statements."],L:[["timeline","tl-prasad","His abduction account"],["timeline","tl-videos","The videos that drew him in"]]},
{id:"pp-marrs",t:"Jim Marrs",a:"James Marrs",s:"Journalist and conspiracy author, 1943 to 2017",d:["A Fort Worth newspaper reporter whose 1989 book Crossfire became a main source for Oliver Stone's film JFK and a New York Times bestseller.","He went on to write bestselling books asserting government conspiracies about UFOs, remote viewing, secret societies, and the September 11 attacks, and was a member of Scholars for 9/11 Truth. He died in 2017."],L:[["timeline","tl-b-alienagenda","Alien Agenda, 1997"],["timeline","tl-b-psispies","Psi Spies, 2002"],["timeline","tl-b-crossfire","Crossfire, 1989"],["tree","stargate","Wrote about the Stargate Project"]]},
{id:"pp-vonneumann",t:"John von Neumann",a:"Johnny von Neumann, Neumann János",s:"Mathematician and physicist, 1903 to 1957",d:["A Hungarian-born mathematician and physicist at the Institute for Advanced Study in Princeton. He worked on the Manhattan Project at Los Alamos, helped shape the ENIAC computer, chaired the Defense Department's Strategic Missile Evaluation Committee, and in 1955 became a commissioner of the Atomic Energy Commission. He died in February 1957.","He has no documented connection to UFOs, but his analysis of self-replicating machines gave its name to \"von Neumann probes,\" a fixture of the debate over why no alien visitors have been confirmed. He was also one of \"the Martians,\" the Hungarian émigré scientists about whom Leo Szilard joked that aliens were already here and \"just call themselves Hungarians.\" Decades after his death, Philadelphia Experiment and Montauk Project lore cast him as the secret director of both."],L:[["tree","manhattan","Manhattan Project"],["tree","aec","Atomic Energy Commission"],["map","m-losalamos","Los Alamos"],["timeline","tl-fermi","Von Neumann probes and the Fermi paradox"]]},
{id:"pp-bush",t:"Vannevar Bush",a:"Dr. Vannevar Bush",s:"Science administrator, 1890 to 1974",d:["An engineer who led the Office of Scientific Research and Development in World War II, which ran almost all wartime military research, including radar and the start of the Manhattan Project. His 1945 report Science, The Endless Frontier led to the National Science Foundation, and his essay \"As We May Think\" inspired generations of computer scientists.","His name runs through UFO lore. A 1950 memo by Canadian engineer Wilbert Smith says a U.S. scientist told him America's flying saucer studies were led by Bush, and the Majestic 12 papers cast him as the man Truman authorized to set up their alleged committee. No official record confirms either, and the MJ-12 papers are considered fake."],L:[["tree","manhattan","Started the Manhattan Project"],["timeline","tl-smithmemo","Named in the Wilbert Smith memo"],["timeline","tl-mj12","Named in the Majestic 12 papers"]]},
{id:"pp-dick",t:"Steven J. Dick",a:"Steven Dick",s:"NASA chief historian, born 1949",d:["An astronomer and historian of science who worked at the U.S. Naval Observatory from 1979 to 2003, served as NASA's chief historian from 2003 to 2009, and held the NASA and Library of Congress chair in astrobiology in 2013 and 2014. He helped define astrobiology as a field and set up the NASA Astrobiology Institute.","His history of the 20th-century debate over alien life, The Biological Universe, gives the UFO controversy its own chapter, treating it as part of how scientists argued about life beyond Earth rather than as a fringe topic."],L:[["tree","nasa","NASA chief historian"],["timeline","tl-b-bioluniverse","Wrote The Biological Universe"]]},
{id:"pp-hellyer",t:"Paul Hellyer",a:"Paul T. Hellyer",s:"Canadian defence minister, 1923 to 2021",d:["A Liberal member of Parliament for more than twenty years, he was Canada's Minister of National Defence from 1963 to 1967, when he merged the army, navy and air force into a single service. In 1968 Pierre Trudeau named him Senior Minister.","In 1967 he opened a UFO landing pad in St. Paul, Alberta, built for Canada's centennial. In 2005 he said publicly that he believed UFOs were real, and he went on to urge governments to release alien technology to fight climate change. He became the highest-ranking former official to make such claims, though he offered no documents, and he repeated the Project Serpo story that its source later admitted was disinformation."],L:[["map","w-stpaul","Opened the St. Paul UFO landing pad"],["timeline","tl-hellyer","Went public in 2005"],["timeline","tl-serpo","Repeated the Serpo story"]]},
{id:"pp-goddard",t:"Victor Goddard",a:"Sir Robert Victor Goddard, Air Marshal Goddard",s:"Royal Air Force air marshal, 1897 to 1987",d:["A senior RAF commander who was Chief of the Air Staff of the Royal New Zealand Air Force from 1941 to 1943, during the Pacific war. After retiring in 1951 he ran the College of Aeronautics at Cranfield until 1954.","He said that in 1935, flying over the disused airfield at Drem in Scotland, he briefly saw it active again, with yellow planes and mechanics in blue overalls, details that came true years later. The story is often told as a time slip. In retirement he lectured on flying saucers, and in a 1969 talk at Caxton Hall in London he argued they could come from an unseen, paraphysical realm rather than another planet."],L:[["timeline","tl-goddard69","Caxton Hall UFO talk, 1969"],["timeline","tl-b-flightreality","Wrote Flight Towards Reality"]]},
{id:"pp-wargo",t:"Eric Wargo",a:"Eric Wargo",s:"Anthropologist and writer on precognition",d:["A science writer and editor in Washington, D.C., with a PhD in anthropology from Emory University. He writes about science fiction, consciousness and the paranormal on his blog, The Nightshirt.","His book Time Loops argues that the future can affect the present without paradox, and that some dreams and hunches are memories of our own future experiences. Supporters such as religion scholar Jeffrey Kripal praised it, while mainstream science does not accept that precognition exists."],L:[["timeline","tl-b-timeloops","Wrote Time Loops"]]},
{id:"pp-keyhoe",t:"Donald Keyhoe",a:"Donald E. Keyhoe, Major Keyhoe",s:"Marine Corps aviator and author, 1897 to 1988",d:["A retired Marine Corps major whose 1950 book The Flying Saucers Are Real argued that the Air Force was hiding what it knew.","He led NICAP from 1957 to 1969 and pressed Congress to hold open UFO hearings."],L:[["map","m-nicap","Led NICAP from 1957 to 1969"],["timeline","tl-nicap","NICAP's founding"]]},
{id:"pp-hynek",t:"J. Allen Hynek",a:"Josef Allen Hynek, Allen Hynek",s:"Astronomer, 1910 to 1986",d:["The Air Force's scientific consultant on Projects Sign, Grudge, and Blue Book from 1948 to 1969. He began as a skeptic but came to argue that some cases deserved serious study.","He coined the \"close encounters\" categories and founded the Center for UFO Studies in 1973."],L:[["tree","bluebook","Scientific consultant to Blue Book"],["map","m-wpafb","Blue Book was run from Wright-Patterson"],["map","m-socorro","Investigated the 1964 Socorro landing"],["timeline","tl-p-bluebook","Sign, Grudge, and Blue Book, 1948 to 1969"]]},
{id:"pp-condon",t:"Edward Condon",a:"Edward U. Condon",s:"Physicist, 1902 to 1974",d:["Led the Air Force-funded University of Colorado UFO study. Its report concluded that further study was unlikely to be productive, and Project Blue Book closed soon after."],L:[["timeline","tl-condon","The Condon Report"],["tree","bluebook","Led to Blue Book's closing"]]},
{id:"pp-grusch",t:"David Grusch",a:"Dave Grusch",s:"Former intelligence officer",d:["An Air Force veteran and former intelligence officer who represented his agency on the UAP Task Force.","In July 2023 he testified to the House Oversight Committee that the government runs a secret program to recover crashed craft. AARO's 2024 historical report found no evidence of such a program."],L:[["timeline","tl-hearing","Testified at the July 2023 House hearing"],["tree","oversight","House Oversight Committee"],["tree","uaptf","Worked with the UAP Task Force"]]},
{id:"pp-elizondo",t:"Luis Elizondo",a:"Lue Elizondo",s:"Former Pentagon intelligence official",d:["Says he ran AATIP until he resigned in 2017, which the Pentagon disputes. He was a central figure in The New York Times' December 2017 report on the program."],L:[["tree","aatip","AATIP"],["timeline","tl-nyt","AATIP revealed, 2017"]]},
{id:"pp-fravor",t:"David Fravor",a:"Dave Fravor, Commander Fravor",s:"Retired Navy commander",d:["Led the F/A-18 flight that encountered the Tic Tac object off Baja California in November 2004. He testified at the House hearing in July 2023."],L:[["map","m-tictac","Nimitz Tic Tac encounter"],["timeline","tl-e-m-tictac","The 2004 encounter"],["timeline","tl-hearing","Testified at the July 2023 House hearing"],["tree","navy","Navy aviator"]]},
{id:"pp-graves",t:"Ryan Graves",a:"",s:"Former Navy pilot",d:["A former F/A-18 pilot who has said his squadron saw unidentified objects almost daily off the East Coast in 2014 and 2015. He testified at the House hearing in July 2023."],L:[["map","m-gimbal","Gimbal and GoFast videos"],["timeline","tl-hearing","Testified at the July 2023 House hearing"],["tree","navy","Navy aviator"]]},
{id:"pp-reid",t:"Harry Reid",a:"Senator Reid",s:"U.S. senator from Nevada, 1939 to 2021",d:["The Senate majority leader who championed AAWSAP, the DIA's roughly $22 million UAP research contract with Bigelow Aerospace Advanced Space Studies."],L:[["tree","aawsap","Championed AAWSAP"],["tree","congress","Congress"],["map","m-skinwalker","A main AAWSAP research site"]]},
{id:"pp-bigelow",t:"Robert Bigelow",a:"Bigelow Aerospace, BAASS",s:"Businessman",d:["Founder of Bigelow Aerospace. His company BAASS held the AAWSAP contract, and he owned Skinwalker Ranch from 1996 to 2016."],L:[["tree","aawsap","His company held the AAWSAP contract"],["map","m-skinwalker","Owned Skinwalker Ranch"]]},
{id:"pp-hicks",t:"Kathleen Hicks",a:"",s:"Deputy Secretary of Defense, 2021 to 2025",d:["Set up AOIMSG in 2021 and AARO in 2022. AARO reports to her former office."],L:[["tree","depsec","Deputy Secretary of Defense"],["tree","aoimsg","Created AOIMSG"],["tree","aaro","Created AARO"]]},
{id:"pp-kirkpatrick",t:"Sean Kirkpatrick",a:"",s:"Physicist, first director of AARO",d:["Led AARO from its founding in 2022 until 2023."],L:[["tree","aaro","First AARO director"]]},
{id:"pp-kosloski",t:"Jon T. Kosloski",a:"Jon Kosloski",s:"Director of AARO",d:["The current director of AARO."],L:[["tree","aaro","AARO director"]]},
{id:"pp-mcinerney",t:"Mark McInerney",a:"",s:"NASA director of UAP research",d:["Named NASA's first director of UAP research in September 2023. Before that he was NASA's liaison to the Department of Defense on UAP."],L:[["tree","nasadir","First director, named 2023"]]},
{id:"pp-spergel",t:"David Spergel",a:"",s:"Astrophysicist",d:["Chaired NASA's UAP independent study team, whose September 2023 report found no evidence of extraterrestrial origin."],L:[["tree","nasastudy","Chaired the study team"],["map","m-nasahq","NASA headquarters"]]},
{id:"pp-groves",t:"Leslie Groves",a:"General Groves",s:"Army general, 1896 to 1970",d:["Directed the Manhattan Project for the Army Corps of Engineers."],L:[["tree","manhattan","Led the Manhattan Project"],["timeline","tl-p-manhattan","Manhattan Project, 1942 to 1946"]]},
{id:"pp-oppenheimer",t:"J. Robert Oppenheimer",a:"Robert Oppenheimer",s:"Physicist, 1904 to 1967",d:["Directed the Los Alamos laboratory that designed the first atomic bombs."],L:[["tree","manhattan","Manhattan Project"],["map","m-losalamos","Directed the Los Alamos lab"],["map","m-trinity","Trinity test, July 1945"]]},
{id:"pp-arnold",t:"Kenneth Arnold",a:"",s:"Pilot, 1915 to 1984",d:["His June 1947 report of nine fast-moving objects near Mount Rainier led the press to coin the term \"flying saucer.\""],L:[["map","m-arnold","Kenneth Arnold sighting"],["timeline","tl-e-m-arnold","1947"]]},
{id:"pp-zamora",t:"Lonnie Zamora",a:"",s:"Police officer",d:["Reported an egg-shaped craft and two small figures outside Socorro, New Mexico, in April 1964."],L:[["map","m-socorro","Socorro landing"],["timeline","tl-e-m-socorro","1964"]]},
{id:"pp-hills",t:"Betty and Barney Hill",a:"Betty Hill, Barney Hill",s:"Abduction witnesses",d:["A New Hampshire couple whose 1961 account became the first widely publicized alien abduction story."],L:[["map","m-hills","Betty and Barney Hill"],["timeline","tl-e-m-hills","1961"]]},
{id:"pp-walton",t:"Travis Walton",a:"",s:"Logger",d:["Went missing for five days starting November 5, 1975, after his logging crew said a beam from a craft struck him in an Arizona forest."],L:[["map","m-walton","Travis Walton case"],["timeline","tl-e-m-walton","1975"]]},
{id:"pp-mantell",t:"Thomas Mantell",a:"Captain Mantell",s:"Air National Guard pilot, 1922 to 1948",d:["Died in January 1948 when his P-51 crashed while he was chasing an unidentified object over Kentucky. The Air Force later concluded he was most likely chasing a high-altitude Skyhook balloon."],L:[["map","m-mantell","Mantell incident"],["timeline","tl-e-m-mantell","1948"]]},

{id:"pp-puthoff",t:"Harold Puthoff",a:"Hal Puthoff",s:"Physicist",d:["Began CIA-funded remote-viewing research at SRI International in 1972 with Russell Targ."],L:[["tree","stargate","Stargate Project"],["map","m-sri","SRI International"],["timeline","tl-geller","The SRI tests, published in Nature"]]},

{id:"pp-halt",t:"Charles Halt",a:"Lt. Col. Halt",s:"Air Force officer",d:["Deputy base commander at RAF Bentwaters and Woodbridge who wrote the official memo about the 1980 Rendlesham Forest incident."],L:[["map","w-rendlesham","Rendlesham Forest incident"],["map","w-bentwaters","RAF Bentwaters and Woodbridge"],["timeline","tl-e-w-rendlesham","1980"]]},
{id:"pp-mack",t:"John Mack",a:"John E. Mack",s:"Psychiatrist, 1929 to 2004",d:["A Harvard psychiatrist who studied people reporting abductions and interviewed the children of the Ariel School."],L:[["map","w-ariel","Ariel School sighting"],["timeline","tl-e-w-ariel","1994"]]},
{id:"pp-pope",t:"Nick Pope",a:"Nicholas Pope",s:"Ministry of Defence official and UFO commentator, 1965 to 2026",d:["A British civil servant at the Ministry of Defence from 1985 to 2006 who, from 1991 to 1994, handled the department's UFO reports, including the 1993 Cosford incident. His 1996 book Open Skies, Closed Minds argued that some cases deserved serious study.","He later became a familiar commentator on UFOs in the press and on television, often saying most sightings have ordinary explanations while a small share stay unexplained. He died in April 2026."],L:[["map","w-mod","Ministry of Defence UFO desk"],["map","w-cosford","Cosford incident"],["timeline","tl-b-openskies","Open Skies, Closed Minds, 1996"]]},
{id:"pp-smith",t:"Wilbert Smith",a:"Wilbert B. Smith",s:"Radio engineer, 1910 to 1962",d:["Led Project Magnet, the Canadian government's UFO study, from 1950 to 1954. It grew out of his November 1950 memo, which reported that U.S. scientist Robert Sarbacher told him America's flying saucer studies were led by Vannevar Bush."],L:[["map","w-magnet","Project Magnet"],["timeline","tl-smithmemo","Wrote the 1950 flying saucer memo"]]},

/* famous UFO books on the timeline: [id, year, title, author ids, description, map pin, org chart box] */
var TLBK=[
["scully",1950,"Behind the Flying Saucers",["pp-scully"],"The first bestselling UFO book. It told the Aztec, New Mexico, crash story, with bodies of small humanoids recovered by the military, based on accounts from Silas Newton and \"Dr. Gee.\" Both were exposed as con men in 1952.","m-aztec"],
["leir",1999,"The Aliens and the Scalpel",["pp-leir"],"Podiatrist Roger Leir described surgeries in which he removed small objects from people who said they had been abducted, and argued they were alien implants. Analyses of the objects have not shown them to be anything but ordinary materials, and the claims remain unverified."],
["bledsoe",2023,"UFO of God",["pp-bledsoe"],"Chris Bledsoe's memoir of his 2007 Cape Fear River encounter, the illness he says it healed, and years of further experiences he links to faith and to a feminine presence he calls \"the Lady.\" Its claims are unverified.","m-bledsoe"],
["communion",1987,"Communion",["pp-strieber"],"Whitley Strieber's account of being taken from his upstate New York cabin by \"the visitors\" in December 1985. A No. 1 bestseller, its cover painting helped define the popular image of the gray alien. His claims are unverified.","m-strieber"],
["superanatural",2016,"The Super Natural",["pp-strieber","pp-kripal"],"Strieber and Rice University religion scholar Jeffrey Kripal look at encounter experiences as a real human phenomenon to be studied, without assuming they are visits from other planets.","m-strieber"],
["millennial",2002,"Millennial Hospitality",["pp-chall"],"The first of Charles Hall's memoirs describing his claimed encounters with the \"Tall Whites\" while serving as an Air Force weather observer in Nevada in the 1960s. Unverified.","m-hall"],
["fort",1919,"The Book of the Damned",["pp-fort"],"Charles Fort's first collection of what he called damned data: reports of strange lights in the sky, falls of fish and frogs, and other anomalies that the science of his day ignored. It predates the flying saucer era by decades, and such oddities are still called Fortean in his honor."],
["jung",1958,"Flying Saucers: A Modern Myth of Things Seen in the Skies",["pp-jung"],"The Swiss psychiatrist analyzed the saucer wave as a modern myth, asking why anxious Cold War people were seeing round, glowing symbols of wholeness in the sky. He left open whether something physical lay behind some reports. Published in German in 1958 and in English in 1959."],
["menzel",1953,"Flying Saucers",["pp-menzel"],"Harvard astronomer Donald Menzel's skeptical account argued that saucer reports came from misidentified stars, aircraft, and clouds, or from unfamiliar atmospheric effects such as mirages. It set the template for scientific debunking."],
["klass",1974,"UFOs Explained",["pp-klass"],"Aviation journalist Philip Klass worked through famous cases and argued each had an ordinary explanation, from misperception to hoax. It made him the best-known UFO skeptic of his era."],
["miragemen",2010,"Mirage Men",["pp-pilkington"],"Mark Pilkington's investigation of how U.S. military and intelligence officers spread and exploited UFO stories during the Cold War, built around Richard Doty, the Paul Bennewitz affair, and the Aviary. It became a 2013 documentary.","m-kirtland","mj12"],
["projectbeta",2005,"Project Beta",["pp-gbishop"],"Greg Bishop's history of the Bennewitz affair: how an Albuquerque physicist's belief in alien signals near Kirtland Air Force Base was fed by Air Force disinformation until he broke down. The title comes from Bennewitz's own 1988 paper on attacking the alien base he believed was at Dulce.","m-kirtland"],
["area51book",2011,"Area 51: An Uncensored History",["pp-jacobsen"],"Annie Jacobsen's history of the Nevada test site, drawing on interviews with veterans of the U-2, A-12, and other secret aircraft programs flown there. Its final chapter claimed, from a single unnamed source, that Roswell was a Soviet plot, a claim historians and reviewers widely rejected.","m-area51"],
["phenomena",2017,"Phenomena",["pp-jacobsen"],"Jacobsen's history of U.S. government research into ESP and psychokinesis, from early CIA work through SRI and the Stargate remote-viewing program.","m-sri","stargate"],
["crashroswell",1991,"UFO Crash at Roswell",["pp-randle","pp-schmitt"],"Kevin Randle and Donald Schmitt gathered witness accounts of strange debris and, in later tellings, bodies, helping turn Roswell into the model crash-retrieval story. Several of the witness accounts were later questioned or discredited.","m-roswell"],
["andreasson",1979,"The Andreasson Affair",["pp-fowler"],"Raymond Fowler's account of Betty Andreasson, a Massachusetts woman who described under hypnosis being taken from her home by small beings in 1967. It is credited with introducing alleged alien implants into abduction accounts; critics question memories recovered under hypnosis."],
["openskies",1996,"Open Skies, Closed Minds",["pp-pope"],"Nick Pope's account of his years on the British Ministry of Defence's UFO desk in the early 1990s, including the Cosford incident, and his case that some reports deserved more serious study.","w-cosford"],
["inplainsight",2021,"In Plain Sight",["pp-coulthart"],"Australian investigative journalist Ross Coulthart's book on UFOs and alleged secret crash-retrieval programs. Two years later he conducted David Grusch's first television interview."],
["graff",2023,"UFO: The Inside Story of the US Government's Search for Alien Life",["pp-graff"],"Journalist and historian Garrett Graff's history of how the U.S. government has handled UFOs, from the first Air Force projects to AARO, written as a skeptical but open-minded account.",null,"aaro"],
["fingerprints",1995,"Fingerprints of the Gods",["pp-hancock"],"Graham Hancock's bestseller argued that an advanced lost civilization, wiped out at the end of the last Ice Age, left its mark on monuments such as Giza and Tiwanaku. Unlike von Däniken he did not invoke aliens. Archaeologists reject the theory as pseudoarchaeology.","a-giza"],
["serpokasten",2013,"Secret Journey to Planet Serpo",["Len Kasten"],"Len Kasten's book presents Project Serpo as a true story, retelling the alleged 1965 to 1978 mission of twelve U.S. military personnel to a planet in the Zeta Reticuli system. It draws on the anonymous Serpo releases, which claimed to come from Defense Intelligence Agency files and the team commander's diary; no such documents have ever been authenticated."],
["serpodempsey",2018,"Project Serpo: A Top-Secret Human Exchange Program",["Richard J. Dempsey"],"A narrative retelling of the Serpo story, later released as an audiobook, covering the alleged 13-year exchange program and the team's debriefings. Like the story itself, it rests on the unverified anonymous releases."],
["serpogn",2008,"Serpo (graphic novel)",["Jason M. Burns","Joe Eisma"],"A Devil's Due Publishing graphic novel that fictionalizes the premise: a newspaper reporter uncovers a secret interplanetary exchange program and investigates why only eight of the twelve Americans sent to the planet Serpo came back."],
["serpogilbert",2025,"Project Serpo: Debunking an Alleged Interstellar Exchange Program",["Horace D. Gilbert"],"An independently published critical look at the Serpo story that tries to separate internet lore and the social dynamics around it from anything that can be verified."],
["crossfire",1989,"Crossfire: The Plot That Killed Kennedy",["pp-marrs"],"Jim Marrs's survey of John F. Kennedy assassination conspiracy theories, which became a New York Times paperback bestseller and a main source for Oliver Stone's 1991 film JFK. Historians and the official investigations reject its central claims."],
["alienagenda",1997,"Alien Agenda",["pp-marrs"],"Marrs's investigation of UFOs, arguing that the government has long hidden an extraterrestrial presence. It draws heavily on witness claims and the disclosure literature of its time."],
["rulebysecrecy",2000,"Rule by Secrecy",["pp-marrs"],"A bestseller claiming a hidden history that links the Trilateral Commission, the Freemasons, and other modern secret societies to the builders of the Great Pyramids. Historians regard its connections as conspiracy theory.","a-giza"],
["psispies",2002,"Psi Spies",["pp-marrs"],"Marrs's account of the U.S. military's remote-viewing program, later known as Stargate, built on interviews with former psychic spies. The program was real; a 1995 review found it never produced useful intelligence.","m-meade","stargate"],
["waronfreedom",2003,"The War on Freedom",["pp-marrs"],"Marrs's book promoting conspiracy theories about the September 11 attacks, reissued in 2006 as The Terror Conspiracy. Its claims are rejected by the 9/11 Commission and independent investigations."],
["fourthreich",2008,"The Rise of the Fourth Reich",["pp-marrs"],"Marrs argues that Nazi ideas and personnel survived World War II and secretly shaped postwar American power, a theme that touches documented programs such as Operation Paperclip but extends them into a broad conspiracy.",null,"paperclip"],
["trilliondollar",2010,"The Trillion-Dollar Conspiracy",["pp-marrs"],"Marrs's argument that global economic troubles and government policy are driven by a hidden elite agenda."],
["oswaldsconfession",2012,"Oswald's Confession and Other Tales from the War",["pp-marrs","Michael H. Price"],"A comic book that Marrs wrote and illustrated with Michael H. Price, published by Cremo Studios."],
["occulted",2013,"Our Occulted History",["pp-marrs"],"Subtitled Do the Global Elite Conceal Ancient Aliens?, it argues that ancient civilizations show signs of extraterrestrial influence that elites keep hidden. Archaeologists reject ancient astronaut claims.","a-giza"],

    var c=err&&err.code;

function qzShuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function qzFirst(t){t=String(t||"").replace(/\s+/g," ").trim();var m=t.match(/^.*?[.!?](?=\s+[A-Z"]|$)/);return m?m[0]:t}
function qzPlace(p){var segs=String(p.s||"").split(/,\s*/).filter(function(x){return x&&!/\d/.test(x)&&!/^(late|early|mid|near|about|around)\b/i.test(x)&&!/\b(January|February|March|April|May|June|July|August|September|October|November|December|century|era|today|now)\b/i.test(x)});
  segs=segs.slice(-2);if(segs.length>1&&/[A-Z]{3,}/.test(segs[0])&&!/^[A-Z]{2}$/.test(segs[0]))segs=segs.slice(1);return segs.join(", ")}
/* statuses that are easy to confuse never appear together, so a claim question has one clearly best answer */
var QZGRP=[["disputed","contested","unverified"],["confirmed","partly"],["explained","false","denied"]];
function qzClaims(n){return qzShuffle(CLAIMS.slice()).slice(0,n).map(function(c){
  var others=QZGRP.filter(function(g){return g.indexOf(c.st)<0}),pick=[];
  others.forEach(function(g){pick.push(qzShuffle(g.slice())[0])});
  var rest=qzShuffle([].concat.apply([],others).filter(function(k){return pick.indexOf(k)<0&&CLST[k]}));
  var opts=qzShuffle([c.st].concat(pick.filter(function(k){return CLST[k]}),rest).slice(0,4));
  var who=c.by&&PBy[c.by]?PBy[c.by].t:(c.byt||"");
  return {k:"Claim or record?",q:c.t,sub:"Claimed by "+who+", "+c.yr+". What does the public record say?",opts:opts.map(function(k){return {v:k,l:CLST[k][0],st:k}}),ans:c.st,
    why:"<b>"+esc(CLST[c.st][0])+"</b> \u2014 "+esc(CLST[c.st][1])+"<p>"+esc(qzFirst(c.r))+"</p>",go:["claim",c.id],gol:"Read the full entry"}})}
function qzWhen(n){var now=new Date().getFullYear(),pool=TL.filter(function(e){return e.type==="ev"&&e.kind!=="book"&&e.kind!=="tech"&&e.yr>=1900&&e.yr<=now&&e.t});

      why:"<b>"+e.yr+".</b>"+(desc?"<p>"+esc(qzFirst(desc))+"</p>":""),go:["timeline",e.id],gol:"Show it on the timeline"}})}

    var words=pl.toLowerCase().split(/[^a-z\u00c0-\u024f]+/).filter(function(w){return w.length>=4&&!/^(county|state|island|islands|north|south|east|west|near|base|region|province|valley|river|lake|mount|desert|ocean)$/.test(w)});
    var tl=p.t.toLowerCase();return !words.some(function(w){return tl.indexOf(w)>=0})});
