"m-kirtland","c":"mil","t":"Kirtland AFB","s":"New Mexico","d":"Air Force Research Lab and nuclear weapons center. Site of the 1980 Bennewitz affair, in which Air Force agent Richard Doty fed UFO disinformation to a local businessman.","u":1,"lat":35.0386,"lon":-106.6101},{"id":"m-cannon","c":"mil","t":"Cannon AFB","s":"New Mexico","d":"Air Force special operations base.","u":0,"lat":34.381,"lon":-103.3238},{"id":"m-davismonthan","c":"mil","t":"Davis-Monthan AFB","s":"Arizona","d":"Home of the aircraft boneyard in Tucson.","u":0,"lat":32.1665,"lon":-110.8818},{"id":"m-luke","c":"mil","t":"Luke AFB","s":"Arizona","d":"F-35 training base west of Phoenix.","u":0,"lat":33.5365,"lon":-112.381},{"id":"m-hill","c":"mil","t":"Hill AFB","s":"Utah","d":"F-35 base and Air Force sustainment center.","u":0,"lat":41.1253,"lon":-111.9738},{"id":"m-mountainhome","c":"mil","t":"Mountain Home AFB","s":"Idaho","d":"Air Force fighter base.","u":0,"lat":43.0411,"lon":-115.8706},{"id":"m-tinker","c":"mil","t":"Tinker AFB","s":"Oklahoma","d":"Air Force maintenance and AWACS base.","u":0,"lat":35.4148,"lon":-97.3871},{"id":"m-dyess","c":"mil","t":"Dyess AFB","s":"Texas","d":"B-1 bomber base.","u":0,"lat":32.4221,"lon":-99.8556},{"id":"m-jbsa","c":"mil","t":"Joint Base San Antonio","s":"Texas","d":"Air Force basic training and medical hub.","u":0,"lat":29.3849,"lon":-98.5804},{"id":"m-ellsworth","c":"mil","t":"Ellsworth AFB","s":"South Dakota","d":"B-1 bomber base, future home of the B-21. In the 1970s its 44th Missile Wing ran Minuteman nuclear missile sites across western South Dakota, the setting of the disputed 1977 L-9 incident.","u":1,"lat":44.1437,"lon":-103.1009},{"id":"m-grandforks","c":"mil","t":"Grand Forks AFB","s":"North Dakota","d":"Air Force drone and ISR base.","u":0,"lat":47.9607,"lon":-97.3985},{"id":"m-scott","c":"mil","t":"Scott AFB","s":"Illinois","d":"Headquarters of Transportation Command.","u":0,"lat":38.5437,"lon":-89.8345},{"id":"m-travis","c":"mil","t":"Travis AFB","s":"California","d":"Largest Air Force airlift base.","u":0,"lat":38.2652,"lon":-121.926},{"id":"m-beale","c":"mil","t":"Beale AFB","s":"California","d":"Home of the U-2 spy plane.","u":0,"lat":39.1345,"lon":-121.4359},{"id":"m-fairchild","c":"mil","t":"Fairchild AFB","s":"Washington","d":"Air Force aerial refueling base.","u":0,"lat":47.6156,"lon":-117.6562},{"id":"m-robins","c":"mil","t":"Robins AFB","s":"Georgia","d":"Air Force logistics center.","u":0,"lat":32.6421,"lon":-83.5892},{"id":"m-seymour","c":"mil","t":"Seymour Johnson AFB","s":"North Carolina","d":"F-15E Strike Eagle base.","u":0,"lat":35.3393,"lon":-77.9606},{"id":"m-shaw","c":"mil","t":"Shaw AFB","s":"South Carolina","d":"F-16 base and Air Forces Central headquarters.","u":0,"lat":33.9746,"lon":-80.4731},{"id":"m-dover","c":"mil","t":"Dover AFB","s":"Delaware","d":"Major airlift base.","u":0,"lat":39.1286,"lon":-75.4672},{"id":"m-mcguire","c":"mil","t":"Joint Base McGuire-Dix-Lakehurst","s":"New Jersey","d":"Joint base, including Lakehurst, where the Hindenburg crashed. Drones were reported over the base in the late 2024 New Jersey drone wave.","u":1,"lat":40.0186,"lon":-74.5941},{"id":"m-jber","c":"mil","t":"Joint Base Elmendorf-Richardson","s":"Alaska","d":"Largest military installation in Alaska.","u":0,"lat":61.2504,"lon":-149.8112},{"id":"m-eielson","c":"mil","t":"Eielson AFB","s":"Alaska","d":"F-35 base near Fairbanks.","u":0,"lat":64.6647,"lon":-147.0887},{"id":"m-roswell","c":"uap","t":"Roswell","s":"New Mexico, 1947","d":"Army Air Field officers announced a recovered flying disc in July 1947, then called it a weather balloon. The Air Force later identified it as Project Mogul, a classified balloon array. It remains the most famous UFO case.","u":0,"lat":33.3948,"lon":-104.522},{"id":"m-skinwalker","c":"uap","t":"Skinwalker Ranch","s":"Uintah Basin, Utah","d":"A ranch with long-reported strange lights, animal deaths, and other anomalies. It was a major research site for BAASS under the DIA-funded AAWSAP program.","u":0,"lat":40.2564,"lon":-109.8897},{"id":"m-area51","c":"uap","t":"Area 51","s":"Groom Lake, Nevada","d":"A classified Air Force test site. The U-2 and later stealth aircraft were flown here, which accounts for many sightings, and it is the center of reverse-engineering legends.","u":0,"lat":37.2351,"lon":-115.8092},{"id":"m-phoenix","c":"uap","t":"Phoenix Lights","s":"Arizona, 1997","d":"On March 13, 1997, thousands reported a huge V-shaped formation of lights. The later lights were identified as military flares, but the earlier formation is still debated.","u":0,"lat":33.4465,"lon":-112.076},{"id":"m-tictac","c":"uap","t":"Nimitz Tic Tac encounter","s":"Off San Diego, 2004","d":"In November 2004, USS Princeton radar and F/A-18 pilots, including Cmdr. David Fravor, encountered a fast white object off Baja California. The FLIR1 video was officially released in 2020. Location is approximate.","u":0,"lat":31.6,"lon":-117.5996},{"id":"m-gimbal","c":"uap","t":"Gimbal and GoFast videos","s":"Off Jacksonville, 2015","d":"Videos from USS Theodore Roosevelt's F/A-18s in January 2015 show objects the pilots could not identify. The Pentagon released them in 2020. Location is approximate.","u":0,"lat":30.3017,"lon":-80.4016},{"id":"m-socorro","c":"uap","t":"Socorro landing","s":"New Mexico, 1964","d":"Police officer Lonnie Zamora reported an egg-shaped craft and two small figures. One of Blue Book's best-known unexplained cases.","u":0,"lat":34.058,"lon":-106.8907},{"id":"m-kecksburg","c":"uap","t":"Kecksburg incident","s":"Pennsylvania, 1965","d":"Witnesses reported an acorn-shaped object falling into the woods and a military recovery. Official accounts point to a meteor.","u":0,"lat":40.1835,"lon":-79.462},{"id":"m-hills","c":"uap","t":"Betty and Barney Hill","s":"New Hampshire, 1961","d":"The first widely publicized alien abduction account, in the White Mountains.","u":0,"lat":44.0885,"lon":-71.6799},{"id":"m-exeter","c":"uap","t":"Incident at Exeter","s":"New Hampshire, 1965","d":"Police officers and a teenager reported a large, silent object with red lights.","u":0,"lat":42.9814,"lon":-70.9457},{"id":"m-walton","c":"uap","t":"Travis Walton case","s":"Arizona, November 1975","d":"On November 5, 1975, logger Travis Walton disappeared near Heber, Arizona, after his crew said a beam from a hovering craft struck him. He turned up five days later. The account inspired the film Fire in the Sky.","u":0,"lat":34.3493,"lon":-110.7278},{"id":"m-marfa","c":"uap","t":"Marfa lights","s":"West Texas","d":"Glowing orbs seen east of Marfa for over a century. Studies attribute many to car headlights and atmospheric effects.","u":0,"lat":30.2889,"lon":-103.9298},{"id":"m-hudson","c":"uap","t":"Hudson Valley sightings","s":"New York, 1980s","d":"Thousands reported a huge boomerang-shaped craft in the 1980s. Pine Bush became known as a sighting hotspot.","u":0,"lat":41.5524,"lon":-74.2019},{"id":"m-lubbock","c":"uap","t":"Lubbock Lights","s":"Texas, 1951","d":"Professors and residents saw arcs of lights. Photos were published nationally and investigated by Project Blue Book.","u":0,"lat":33.5786,"lon":-101.8545},{"id":"m-levelland","c":"uap","t":"Levelland sightings","s":"Texas, 1957","d":"Multiple drivers reported a glowing object that stalled their cars.","u":0,"lat":33.586,"lon":-102.3783},{"id":"m-stephenville","c":"uap","t":"Stephenville sightings","s":"Texas, 2008","d":"Dozens reported a large, silent object with bright lights.","u":0,"lat":32.2205,"lon":-98.2007},{"id":"m-pascagoula","c":"uap","t":"Pascagoula abduction","s":"Mississippi, 1973","d":"Two shipyard workers reported being taken aboard a craft while fishing.","u":0,"lat":30.3671,"lon":-88.5577},{"id":"m-arnold","c":"uap","t":"Kenneth Arnold sighting","s":"Mount Rainier, 1947","d":"A pilot reported nine fast objects moving like saucers skipping on water. The press coined the term flying saucer.","u":0,"lat":46.8526,"lon":-121.757},{"id":"m-ohare","c":"uap","t":"O'Hare Airport sighting","s":"Chicago, 2006","d":"United employees and pilots reported a disc hovering over a gate before shooting up through the clouds.","u":0,"lat":41.9797,"lon":-87.9064},{"id":"m-dc1952","c":"uap","t":"Washington flap","s":"Washington, DC, 1952","d":"Radar returns and lights over the capital on two July weekends led to the largest Pentagon press conference since World War II.","u":0,"lat":38.8499,"lon":-77.0363},{"id":"m-pointpleasant","c":"uap","t":"Point Pleasant","s":"West Virginia, 1966 to 1967","d":"Home of the Mothman legend, with many reports of a winged creature and strange lights.","u":0,"lat":38.8427,"lon":-82.1368},{"id":"m-jal1628","c":"uap","t":"Japan Air Lines Flight 1628","s":"Eastern Alaska, 1986","d":"A cargo crew reported huge lights pacing their 747 for about 50 minutes. The FAA investigated. Location is approximate.","u":0,"lat":64.0012,"lon":-145.7124},{"id":"m-deadhorse","c":"uap","t":"Object shot down over Alaska","s":"Near Deadhorse, 2023","d":"On February 10, 2023, a fighter shot down an unidentified object over Alaska's North Slope. The debris was not recovered.","u":0,"lat":70.2023,"lon":-148.3956},{"id":"m-huron","c":"uap","t":"Object shot down over Lake Huron","s":"Michigan, 2023","d":"On February 12, 2023, an F-16 shot down an octagonal object over Lake Huron. Officials first said debris was not recovered, but documents released in November 2024 show it was, and that the object came from a company that sells weather monitoring equipment.","u":0,"lat":45.2985,"lon":-82.5975},{"id":"m-aztec","c":"uap","t":"Aztec UFO crash","s":"Hart Canyon near Aztec, New Mexico, 1948","d":"The story says a flying saucer about 100 feet across landed intact in Hart Canyon, northeast of Aztec, on March 25, 1948, and that the military recovered it along with the bodies of 16 small humanoid crew members. It reached the public through Variety columnist Frank Scully, whose 1950 book Behind the Flying Saucers became a bestseller. Scully's sources were oilman Silas Newton and a man he called \"Dr. Gee,\" later identified as Leo GeBauer. In 1952, reporter J.P. Cahn showed in True magazine that the two were con men selling fake oil-detecting devices, and they were later convicted of fraud. A 1950 FBI memo from agent Guy Hottel, relaying a secondhand story of three saucers recovered in New Mexico, is often linked to the same tale. Researchers such as William Steinman and Scott Ramsey have since argued the crash was real, and the town has held an annual UFO symposium. Most historians regard it as a hoax. The pin marks the approximate crash site.","u":0,"lat":36.94,"lon":-107.85},{"id":"m-brownmtn","c":"uap","t":"Brown Mountain lights","s":"North Carolina","d":"Mysterious glowing orbs reported over a ridge for over a century.","u":0,"lat":35.9121,"lon":-81.8291},{"id":"m-sanluis","c":"uap","t":"San Luis Valley","s":"Colorado","d":"Known for frequent sighting reports and cattle mutilation claims. Home of a roadside UFO watchtower.","u":0,"lat":37.7449,"lon":-105.8801},{"id":"m-bridgewater","c":"uap","t":"Bridgewater Triangle","s":"Southeastern Massachusetts","d":"About 200 square miles of southeastern Massachusetts with corners at Abington, Freetown, and Rehoboth, a name coined by writer Loren Coleman. It has a long history of reported UFOs, strange creatures, and other anomalies, and includes the Hockomock Swamp.","u":0,"lat":41.904,"lon":-71.077},{"id":"m-njdrones","c":"uap","t":"New Jersey drone wave","s":"New Jersey, late 2024","d":"Widespread reports of large drones at night. Federal agencies said most were authorized drones, aircraft, or stars.","u":0,"lat":40.3014,"lon":-74.5973},{"id":"m-rainier2","c":"uap","t":"Washington State hotspot","s":"Pacific Northwest","d":"Washington State has one of the highest rates of reported UFO sightings per person in the U.S., according to civilian databases like NUFORC.","u":0,"lat":47.6,"lon":-122.2974},{"id":"m-losalamos","c":"sec","t":"Los Alamos","s":"Manhattan Project, New Mexico","d":"Secret laboratory where Oppenheimer's scientists designed the first atomic bombs. Confirmed program.","u":0,"lat":35.8793,"lon":-106.2977},{"id":"m-oakridge","c":"sec","t":"Oak Ridge","s":"Manhattan Project, Tennessee","d":"A secret city built to enrich uranium, home to about 75,000 people by 1945. Confirmed program.","u":0,"lat":36.0105,"lon":-84.2695},{"id":"m-hanford","c":"sec","t":"Hanford Site","s":"Manhattan Project, Washington","d":"Produced the plutonium for the Trinity test and the Nagasaki bomb. Confirmed program.","u":0,"lat":46.5496,"lon":-119.4878},{"id":"m-trinity","c":"sec","t":"Trinity test site","s":"Manhattan Project, July 1945","d":"The world's first nuclear explosion, on July 16, 1945, inside what is now White Sands Missile Range. Confirmed program.","u":0,"lat":33.6778,"lon":-106.4777},{"id":"m-chicagopile","c":"sec","t":"Chicago Pile-1","s":"Manhattan Project, 1942","d":"The first controlled nuclear chain reaction, under the stands of the University of Chicago's football field. Confirmed program.","u":0,"lat":41.7932,"lon":-87.5993},{"id":"m-mogul","c":"sec","t":"Project Mogul launches","s":"Alamogordo, New Mexico, 1947","d":"Balloon trains carrying microphones to detect Soviet nuclear tests were launched here. The Air Force says one of them was the Roswell debris. Confirmed program.","u":0,"lat":32.9005,"lon":-105.9596},{"id":"m-detrick","c":"sec","t":"Fort Detrick","s":"MKUltra, Maryland","d":"Army biological research center where the CIA's Special Operations Division worked on MKUltra-related projects. Scientist Frank Olson was secretly dosed with LSD in 1953 and died days later. Confirmed program.","u":0,"lat":39.4347,"lon":-77.4266},{"id":"m-climaxsf","c":"sec","t":"Operation Midnight Climax","s":"MKUltra, San Francisco","d":"CIA safehouses where unwitting people were given LSD and observed, from the mid-1950s into the 1960s. Confirmed program.","u":0,"lat":37.8017,"lon":-122.4082},{"id":"m-climaxny","c":"sec","t":"CIA safehouse, 81 Bedford Street","s":"81 Bedford St, New York, NY 10014","d":"A Greenwich Village apartment the CIA used for MKUltra from about 1953 to 1955. Federal Bureau of Narcotics agent George Hunter White, working for the CIA, secretly dosed unwitting visitors with LSD here and observed the effects. He later ran a similar safehouse in San Francisco, known as Operation Midnight Climax. Confirmed program.","u":0,"lat":40.732,"lon":-74.0051},{"id":"m-meade","c":"sec","t":"Stargate unit","s":"Fort Meade, Maryland","d":"The Army's remote-viewing unit, later run by the DIA, operated here from 1978 until it closed in 1995. Confirmed program.","u":0,"lat":39.1076,"lon":-76.7454},{"id":"m-sri","c":"sec","t":"SRI International","s":"Stargate, Menlo Park, California","d":"Where CIA-funded remote-viewing research began in 1972 with physicists Russell Targ and Harold Puthoff. Confirmed program.","u":0,"lat":37.4579,"lon":-122.1774},{"id":"m-glomar","c":"sec","t":"Glomar Explorer home port","s":"Project Azorian, Long Beach","d":"The CIA's disguised recovery ship sailed from Long Beach in 1974 to raise part of Soviet submarine K-129 from the Pacific floor. Confirmed program.","u":0,"lat":33.7511,"lon":-118.2007},{"id":"m-paperclip","c":"sec","t":"Operation Paperclip rocket team","s":"Huntsville, Alabama","d":"Wernher von Braun's German rocket team moved here in 1950, building the rockets that led to the Saturn V. Confirmed program.","u":0,"lat":34.732,"lon":-86.5876},{"id":"m-mantell","c":"uap","t":"Mantell incident","s":"Franklin, Kentucky, 1948","d":"Air National Guard Capt. Thomas Mantell died chasing a large object. It was later attributed to a classified Skyhook balloon.","u":0,"lat":36.7238,"lon":-86.5759},{"id":"m-chiles","c":"uap","t":"Chiles-Whitted sighting","s":"Near Montgomery, Alabama, 1948","d":"Two Eastern Air Lines pilots reported a cigar-shaped craft with rows of lit windows. One of Project Sign's key cases.","u":0,"lat":32.3678,"lon":-86.2997},{"id":"m-farmington","c":"uap","t":"Farmington armada","s":"New Mexico, 1950","d":"Hundreds of residents reported dozens of objects over town for three days in March 1950.","u":0,"lat":36.7277,"lon":-108.2155},{"id":"m-kelly","c":"uap","t":"Kelly-Hopkinsville encounter","s":"Kentucky, 1955","d":"A farm family reported small glowing creatures attacking their house overnight. Origin of the little green men image.","u":0,"lat":36.8004,"lon":-87.4873},{"id":"m-allagash","c":"uap","t":"Allagash abductions","s":"Maine, 1976","d":"Four men on a canoe trip reported a bright object and later recalled an abduction under hypnosis.","u":0,"lat":46.9013,"lon":-69.1981},{"id":"m-cashlandrum","c":"uap","t":"Cash-Landrum incident","s":"Huffman, Texas, 1980","d":"Three people reported a fiery diamond-shaped object escorted by helicopters, then suffered radiation-like injuries. Their lawsuit against the government was dismissed.","u":0,"lat":30.0196,"lon":-95.0889},{"id":"m-tinley","c":"uap","t":"Tinley Park lights","s":"Illinois, 2004","d":"Hundreds reported three red lights moving in formation, seen on several nights and captured on video.","u":0,"lat":41.5726,"lon":-87.7868},{"id":"w-varginha","c":"uap","t":"Varginha incident","s":"Minas Gerais, Brazil, 1996","lat":-21.5514,"lon":-45.4303,"d":"In January 1996, three young women said they saw a strange creature in a vacant lot, and rumors spread that the military had captured beings nearby. A Brazilian Army inquiry concluded they had seen a local man, and no physical evidence has been made public.","u":0},{"id":"w-ariel","c":"uap","t":"Ariel School sighting","s":"Ruwa, Zimbabwe, 1994","lat":-17.878,"lon":31.254,"d":"On September 16, 1994, more than 60 schoolchildren said a craft landed near their playground and small beings approached them. Harvard psychiatrist John Mack interviewed many of the children, and several have stood by their accounts as adults.","u":0},{"id":"w-rendlesham","c":"uap","t":"Rendlesham Forest incident","s":"Suffolk, England, 1980","lat":52.088,"lon":1.435,"d":"In December 1980, U.S. Air Force personnel from RAF Bentwaters and RAF Woodbridge reported lights and a landed craft in the forest. Deputy base commander Lt. Col. Charles Halt wrote a memo and recorded an audio tape. Skeptics point to the nearby Orford Ness lighthouse.","u":0},{"id":"w-westall","c":"uap","t":"Westall school sighting","s":"Melbourne, Australia, 1966","lat":-37.94,"lon":145.14,"d":"On April 6, 1966, more than 200 students and teachers at two Westall schools reported a craft descending into a nearby field before speeding away. No official explanation was ever given.","u":0},{"id":"w-tehran","c":"uap","t":"Tehran UFO incident","s":"Iran, 1976","lat":35.69,"lon":51.39,"d":"On September 19, 1976, two Imperial Iranian Air Force F-4 jets chased a bright object, and crews reported instrument and weapons failures as they closed in. A U.S. Defense Intelligence Agency memo called it a classic case.","u":0},{"id":"w-belgium","c":"uap","t":"Belgian UFO wave","s":"Eupen, Belgium, 1989 to 1990","lat":50.63,"lon":6.03,"d":"Starting in November 1989, thousands of people reported large triangular craft. On the night of March 30, 1990, the Belgian Air Force sent F-16s after radar contacts and later shared its findings with the public.","u":0},{"id":"w-hessdalen","c":"uap","t":"Hessdalen lights","s":"Hessdalen valley, Norway","lat":62.79,"lon":11.19,"d":"Unexplained lights have appeared in this valley since at least the early 1980s, peaking between 1981 and 1984. An automatic monitoring station has recorded them since 1998, and scientists still study them.","u":0},{"id":"w-colares","c":"uap","t":"Operation Prato","s":"Colares, Brazil, 1977","lat":-0.936,"lon":-48.28,"d":"In 1977, residents of this Amazon island town reported lights that fired burning beams at people. The Brazilian Air Force sent a team under Capt. Uyrangê Hollanda to investigate, and its files were later released.","u":0},{"id":"w-kaikoura","c":"uap","t":"Kaikoura lights","s":"Off Kaikoura, New Zealand, 1978","lat":-42.4,"lon":173.7,"d":"In December 1978, air traffic controllers and cargo plane crews reported unexplained lights, and a TV crew filmed them from a plane on December 30 and 31. Suggested explanations include squid-fishing boat lights and Venus.","u":0},{"id":"w-shag","c":"uap","t":"Shag Harbour incident","s":"Nova Scotia, Canada, 1967","lat":43.495,"lon":-65.71,"d":"On October 4, 1967, witnesses saw a lit object fall into the sea. The Royal Canadian Mounted Police and navy divers searched but found nothing, and Canadian records list it as unexplained.","u":0},{"id":"w-falcon","c":"uap","t":"Falcon Lake incident","s":"Manitoba, Canada, 1967","lat":49.7,"lon":-95.3,"d":"On May 20, 1967, prospector Stefan Michalak said he was burned by exhaust from a landed craft, and he had grid-shaped burns on his chest. Canadian and U.S. investigators could not explain the case.","u":0},{"id":"w-valentich","c":"uap","t":"Valentich disappearance","s":"Bass Strait, Australia, 1978","lat":-39,"lon":143.6,"d":"On October 21, 1978, 20-year-old pilot Frederick Valentich radioed that a large craft was hovering over his plane, then contact was lost. Neither he nor the aircraft was ever found.","u":0},{"id":"w-petrozavodsk","c":"uap","t":"Petrozavodsk phenomenon","s":"Karelia, Russia, 1977","lat":61.79,"lon":34.36,"d":"On September 20, 1977, a glowing, jellyfish-shaped object was seen over the city and far beyond. It prompted a Soviet state UFO research program, and it was most likely a secret rocket launch from Plesetsk.","u":0},{"id":"w-trindade","c":"uap","t":"Trindade Island photos","s":"South Atlantic, Brazil, 1958","lat":-20.51,"lon":-29.32,"d":"On January 16, 1958, a photographer aboard a Brazilian Navy ship took four photos of a Saturn-shaped object. They were released to the press with the government's approval, and skeptics believe they were faked.","u":0},{"id":"w-brazil1986","c":"uap","t":"Official UFO Night","s":"São Paulo state, Brazil, 1986","lat":-23.18,"lon":-45.88,"d":"On May 19, 1986, radar tracked about 20 unknown objects over southeastern Brazil and the Brazilian Air Force scrambled jets. Days later, the Air Force minister discussed the event publicly.","u":0},{"id":"w-cosford","c":"uap","t":"Cosford incident","s":"Shropshire, England, 1993","lat":52.64,"lon":-2.31,"d":"On March 30 and 31, 1993, military staff and police across England reported a huge triangular craft, including over RAF Cosford. Ministry of Defence investigator Nick Pope found no firm explanation; others blame a Russian rocket re-entering the atmosphere.","u":0},{"id":"w-manises","c":"uap","t":"Manises incident","s":"Valencia, Spain, 1979","lat":39.49,"lon":-0.48,"d":"On November 11, 1979, a passenger jet diverted to Valencia's Manises airport after its crew saw red lights following the plane. A Spanish Air Force fighter was sent up, and Spain later declassified the case files.","u":0},{"id":"w-alderney","c":"uap","t":"Alderney sighting","s":"Channel Islands, 2007","lat":49.72,"lon":-2.2,"d":"On April 23, 2007, airline captain Ray Bowyer and some of his passengers saw two large, bright yellow objects. It is one of the best-documented modern airline sightings, and it has no confirmed explanation.","u":0},{"id":"w-calvine","c":"uap","t":"Calvine photo","s":"Highlands, Scotland, 1990","lat":56.78,"lon":-4.02,"d":"In August 1990, two hikers photographed a large diamond-shaped object with a military jet nearby. The Ministry of Defence kept the image, and a print resurfaced in 2022.","u":0},{"id":"w-voronezh","c":"uap","t":"Voronezh sighting","s":"Russia, 1989","lat":51.66,"lon":39.2,"d":"In late September 1989, children reported a landed craft and tall beings in a city park. The Soviet news agency TASS reported the story, which drew attention worldwide.","u":0},{"id":"w-campeche","c":"uap","t":"Mexican Air Force video","s":"Campeche, Mexico, 2004","lat":19.85,"lon":-90.53,"d":"On March 5, 2004, a Mexican Air Force surveillance plane recorded 11 objects on infrared. The Defense Ministry released the footage, and many analysts attribute it to distant oil-platform flares.","u":0},{"id":"w-bariloche","c":"uap","t":"Bariloche incident","s":"Argentina, 1995","lat":-41.15,"lon":-71.31,"d":"On July 31, 1995, an Aerolíneas Argentinas flight approaching Bariloche reported a bright object pacing the plane, and the airport's lights reportedly failed during the landing.","u":0},{"id":"w-xiaoshan","c":"uap","t":"Xiaoshan Airport closure","s":"Hangzhou, China, 2010","lat":30.23,"lon":120.43,"d":"On July 7, 2010, Hangzhou's airport halted flights for about an hour after an unidentified object was reported. Officials did not give a definitive explanation.","u":0},{"id":"w-dalnegorsk","c":"uap","t":"Height 611 incident","s":"Dalnegorsk, Russia, 1986","lat":44.56,"lon":135.58,"d":"On January 29, 1986, witnesses saw a glowing sphere crash into a hill known as Height 611. Researchers collected unusual fragments from the site, and the case is still debated.","u":0},{"id":"w-geipan","c":"gov","t":"GEIPAN","s":"CNES, Toulouse, France","lat":43.561,"lon":1.484,"d":"France's official UAP study unit, part of the national space agency CNES. It began in 1977 as GEPAN and publishes its case files online.","u":0},{"id":"w-mod","c":"gov","t":"Ministry of Defence UFO desk","s":"Whitehall, London, UK","lat":51.5037,"lon":-0.1257,"d":"The UK Ministry of Defence collected UFO reports for decades before closing its UFO desk in 2009. Its files were released through the National Archives between 2008 and 2013.","u":0},{"id":"w-cefaa","c":"gov","t":"CEFAA","s":"Santiago, Chile","lat":-33.45,"lon":-70.66,"d":"Chile's Committee for the Study of Anomalous Aerial Phenomena, set up in 1997 under the country's civil aviation authority to analyze reports from pilots and the public.","u":0},{"id":"w-brazilfab","c":"gov","t":"Brazilian Air Force UFO records","s":"Brasília, Brazil","lat":-15.79,"lon":-47.88,"d":"Since 2010, Brazil's Air Force has been required to send its UFO reports to the National Archives, which has released thousands of pages of records.","u":0},{"id":"w-oifaa","c":"gov","t":"OIFAA","s":"Lima, Peru","lat":-12.05,"lon":-77.04,"d":"The Peruvian Air Force's Office for the Investigation of Anomalous Aerial Phenomena, reopened in 2013.","u":0},{"id":"w-cefae","c":"gov","t":"CEFAe","s":"Buenos Aires, Argentina","lat":-34.6,"lon":-58.38,"d":"The Argentine Air Force's Commission for the Study of Aerospace Phenomena, created in 2011 to investigate unidentified aerial sightings.","u":0},{"id":"w-magnet","c":"gov","t":"Project Magnet","s":"Ottawa, Canada, 1950 to 1954","lat":45.42,"lon":-75.7,"d":"A Canadian Department of Transport study of UFOs led by radio engineer Wilbert Smith. It ended in 1954 without official conclusions.","u":0},{"id":"w-lakenheath","c":"mil","t":"RAF Lakenheath","s":"Suffolk, England","lat":52.409,"lon":0.561,"d":"A U.S. Air Force base in England. In August 1956, radar at Lakenheath and Bentwaters tracked fast-moving targets that RAF night fighters tried to intercept, one of the most-studied radar and visual cases.","u":1},{"id":"w-bentwaters","c":"mil","t":"RAF Bentwaters and Woodbridge","s":"Suffolk, England","lat":52.127,"lon":1.435,"d":"Twin bases used by the U.S. Air Force during the Cold War. Their personnel were at the center of the 1980 Rendlesham Forest incident.","u":1},{"id":"w-menwith","c":"mil","t":"RAF Menwith Hill","s":"North Yorkshire, England","lat":54.008,"lon":-1.69,"d":"A satellite ground station used by the U.S. National Security Agency, known for its golf-ball-shaped radomes.","u":0},{"id":"w-fylingdales","c":"mil","t":"RAF Fylingdales","s":"North Yorkshire, England","lat":54.358,"lon":-0.67,"d":"A British radar station that gives early warning of missile launches and tracks satellites, sharing data with the U.S.","u":0},{"id":"w-pinegap","c":"mil","t":"Pine Gap","s":"Near Alice Springs, Australia","lat":-23.799,"lon":133.737,"d":"The Joint Australian-U.S. Defence Facility, a satellite ground station in the Northern Territory.","u":0},{"id":"w-woomera","c":"mil","t":"Woomera Range","s":"South Australia","lat":-31.2,"lon":136.82,"d":"One of the world's largest weapons and rocket test ranges, used by Australia, the UK, and the U.S. since 1947.","u":0},{"id":"w-ramstein","c":"mil","t":"Ramstein Air Base","s":"Germany","lat":49.437,"lon":7.6,"d":"Headquarters of U.S. Air Forces in Europe.","u":0},{"id":"w-aviano","c":"mil","t":"Aviano Air Base","s":"Italy","lat":46.032,"lon":12.596,"d":"A U.S. Air Force fighter base in northeastern Italy.","u":0},{"id":"w-sigonella","c":"mil","t":"NAS Sigonella","s":"Sicily, Italy","lat":37.4,"lon":14.92,"d":"A U.S. Navy air station in Sicily, supporting operations across the Mediterranean.","u":0},{"id":"w-rota","c":"mil","t":"Naval Station Rota","s":"Spain","lat":36.645,"lon":-6.35,"d":"A U.S. Navy base on Spain's Atlantic coast.","u":0},{"id":"w-incirlik","c":"mil","t":"Incirlik Air Base","s":"Türkiye","lat":37.002,"lon":35.426,"d":"A Turkish air base that hosts U.S. Air Force units.","u":0},{"id":"w-aludeid","c":"mil","t":"Al Udeid Air Base","s":"Qatar","lat":25.117,"lon":51.315,"d":"The largest U.S. military base in the Middle East.","u":0},{"id":"w-lemonnier","c":"mil","t":"Camp Lemonnier","s":"Djibouti","lat":11.547,"lon":43.155,"d":"The main U.S. military base in Africa.","u":0},{"id":"w-diego","c":"mil","t":"Diego Garcia","s":"Indian Ocean","lat":-7.313,"lon":72.411,"d":"A British island territory that hosts a joint UK and U.S. naval and air base.","u":0},{"id":"w-pituffik","c":"mil","t":"Pituffik Space Base","s":"Greenland","lat":76.531,"lon":-68.703,"d":"Formerly Thule Air Base, the U.S. military's northernmost base, with a missile-warning radar.","u":0},{"id":"w-kadena","c":"mil","t":"Kadena Air Base","s":"Okinawa, Japan","lat":26.356,"lon":127.768,"d":"The largest U.S. Air Force base in the Pacific.","u":0},{"id":"w-yokosuka","c":"mil","t":"Fleet Activities Yokosuka","s":"Japan","lat":35.29,"lon":139.67,"d":"Home port of the U.S. Navy's Seventh Fleet.","u":0},{"id":"w-humphreys","c":"mil","t":"Camp Humphreys","s":"South Korea","lat":36.963,"lon":127.031,"d":"The largest U.S. overseas military base.","u":0},{"id":"w-andersen","c":"mil","t":"Andersen Air Force Base","s":"Guam","lat":13.584,"lon":144.93,"d":"A U.S. Air Force base on the Pacific island of Guam.","u":0},{"id":"w-gitmo","c":"mil","t":"Naval Station Guantanamo Bay","s":"Cuba","lat":19.9,"lon":-75.12,"d":"The oldest U.S. overseas naval base, leased from Cuba since 1903.","u":0},{"id":"w-ascension","c":"mil","t":"RAF Ascension Island","s":"South Atlantic","lat":-7.969,"lon":-14.394,"d":"A UK and U.S. airfield and tracking station in the middle of the South Atlantic.","u":0},{"id":"w-plesetsk","c":"mil","t":"Plesetsk Cosmodrome","s":"Arkhangelsk region, Russia","lat":62.93,"lon":40.58,"d":"Russia's northern military spaceport. A 1977 launch from here is the likely cause of the Petrozavodsk phenomenon.","u":1},{"id":"w-kapustin","c":"mil","t":"Kapustin Yar","s":"Astrakhan region, Russia","lat":48.57,"lon":45.75,"d":"The Soviet Union's first rocket test range, founded in 1946 and still used by Russia. UFO folklore calls it the Russian Roswell, but there is no evidence for that.","u":0},{"id":"w-baikonur","c":"mil","t":"Baikonur Cosmodrome","s":"Kazakhstan","lat":45.965,"lon":63.305,"d":"The launch site of Sputnik and Yuri Gagarin, leased by Russia from Kazakhstan.","u":0},{"id":"m-nicap","c":"civ","t":"NICAP headquarters","s":"Washington, DC, 1956 to 1980","d":"The National Investigations Committee on Aerial Phenomena, a civilian group founded in 1956 with T. Townsend Brown as its first director. Under Donald Keyhoe, who led it from 1957 to 1969, it pressed Congress for open UFO hearings. It dissolved in 1980.","u":0,"lat":38.9105,"lon":-77.0437},{"id":"m-denison","c":"civ","t":"Denison University","s":"Granville, Ohio","d":"Where T. Townsend Brown worked with physics professor Paul Alfred Biefeld in the 1920s on what became known as the Biefeld-Brown effect, a thrust produced by high-voltage capacitors. Most physicists attribute it to ion wind.","u":0,"lat":40.0725,"lon":-82.5215},{"id":"w-vilasboas","c":"uap","t":"Antônio Villas Boas abduction","s":"Minas Gerais, Brazil, 1957","d":"In October 1957, farmer Antônio Villas Boas said he was taken aboard a landed craft while plowing his fields at night near São Francisco de Sales. It is one of the earliest widely reported abduction accounts.","u":0,"lat":-19.861,"lon":-49.769},{"id":"w-valdes","c":"uap","t":"Corporal Armando Valdés case","s":"Near Putre, Chile, April 1977","d":"On April 25, 1977, Chilean Army Cpl. Armando Valdés reportedly vanished for about 15 minutes while his patrol watched lights near their camp. His men said he returned with several days' beard growth, and his watch showed a date five days ahead.","u":0,"lat":-18.197,"lon":-69.56},{"id":"w-lyndajones","c":"uap","t":"Lynda Jones sighting","s":"Didsbury, Manchester, England, 1979","d":"In summer 1979, Lynda Jones and her two children saw a large orange, crescent-shaped object hovering near the River Mersey in Didsbury. She got home about 90 minutes later than she expected. Under hypnosis in 1980 she described being examined aboard the craft, and she reported burned eyes and other aftereffects. The case is documented in Philip Mantle and Carl Nagaitis's Without Consent; no official confirmation exists.","u":0,"lat":53.407,"lon":-2.236},{"id":"m-wartena","c":"uap","t":"Udo Wartena encounter","s":"Montana, May 1940","d":"In May 1940, prospector Udo Wartena said a landed craft appeared near his mountain claim in Montana and its occupants spoke with him and invited him aboard. He did not tell his story publicly until decades later. Location is approximate.","u":0,"lat":46.32,"lon":-111.52},{"id":"m-bsra","c":"civ","t":"Borderland Sciences Research Associates","s":"San Diego, California, founded 1945","d":"A group founded by Meade Layne to study psychic and \"borderland\" phenomena. From 1947 it promoted the idea that flying saucers were etheric craft from another plane of existence. Location is approximate.","u":0,"lat":32.72,"lon":-117.16},{"id":"w-rylance","c":"uap","t":"Amy Rylance abduction claim","s":"Gundiah, Queensland, Australia, 2001","d":"Late on October 4, 2001, Petra Heller said she saw 22-year-old Amy Rylance lifted by a beam of light through a window of their property near Gundiah into a hovering craft. About three hours later, Rylance was found dehydrated and disoriented at a service station in Mackay, roughly 790 km (490 miles) north. Supporters cite marks on her body and regrown hair; skeptics consider the case a hoax, and the people involved soon left the area.","u":0,"lat":-25.83,"lon":152.54},{"id":"w-bermuda","c":"uap","t":"Bermuda Triangle","s":"Western North Atlantic","d":"A loosely defined area between Miami, Bermuda, and Puerto Rico that popular books linked to the disappearance of ships and aircraft, including the Navy's Flight 19 in 1945. The U.S. Coast Guard and the insurer Lloyd's of London have found no more losses there than in other heavily traveled ocean areas.","u":0,"lat":25.5,"lon":-70.4},{"id":"w-malmgren","c":"uap","t":"Malmgren shootdown claim","s":"Marshall Islands (claimed), 1962","d":"Economist Harald Malmgren said in a 2025 interview that the U.S. shot down a non-human craft with a classified directed-energy weapon during a 1962 nuclear test in the Marshall Islands, and that he handled the debris. No evidence has been made public, and FBI files released in May 2025 contradict parts of his account of his jobs and clearances at the time. The U.S. held no nuclear tests in the Marshall Islands in 1962; that year's Pacific tests were at Johnston Atoll and Christmas Island, including the high-altitude Starfish Prime shot. Location is approximate.","u":0,"lat":7.1,"lon":171.2}],"zones":[["m-bridgewater",[[-70.945,42.105],[-71.034,41.766],[-71.249,41.84]]],["w-bermuda",[[-80.19,25.774],[-64.781,32.294],[-66.106,18.466]]]]}</script>
<script id="app">
(function(){
/* the timeline key doubles as a filter: each row turns its kind of item on or off */
var TLKEYS=[["active","sw a","Active UAP office"],["closed","sw c","Closed program"],["secret","sw s","Secret project"],["uap","lg-uap","Sighting or incident"],["sec","lg-sec","Secret project event"],["mil","lg-milu","Incident at a base"],["gov","lg-gov","Milestone"],["civ","lg-civ","Civilian or media milestone"],["book","lg-book","Book"],["tech","lg-tech","Tech and media context"]];
var MAPKEYS=[["gov","lg-gov","Government building"],["mil","lg-mil","Military base"],["milu","lg-milu","Base with UAP history"],["uap","lg-uap","UAP or anomaly site"],["sec","lg-sec","Secret project site"],["civ","lg-civ","Civilian research group"],["anc","lg-anc","Ancient site"],["mine","lg-mine","Your pin"]];
function pinKey(p){return p.c==="mil"?(p.u?"milu":"mil"):p.c}
function keySync(sel,keys,on){document.querySelectorAll(sel+" [data-k]").forEach(function(b){b.setAttribute("aria-pressed",on[b.dataset.k]!==false)});
  document.querySelector(sel+' [data-all="1"]').disabled=keys.every(function(r){return on[r[0]]!==false});document.querySelector(sel+' [data-all="0"]').disabled=keys.every(function(r){return on[r[0]]===false});}
function mapKeySync(){keySync(".mapkey",MAPKEYS,filt)}
function mapFilter(){try{localStorage.setItem("watcher-mapkeys",JSON.stringify(filt))}catch(e){}mapKeySync();if(mode==="map")renderMap();}
var TLF={};TLKEYS.forEach(function(r){TLF[r[0]]=r[0]!=="tech"});
try{var tlf0=JSON.parse(localStorage.getItem("watcher-tlkeys")||"{}");Object.keys(tlf0).forEach(function(k){if(k in TLF)TLF[k]=!!tlf0[k]})}catch(e){}
function tlShown(e){return TLF[e.kind]!==false}
function tlKeySync(){keySync(".tlkey",TLKEYS,TLF)}
function tlFilter(){try{localStorage.setItem("watcher-tlkeys",JSON.stringify(TLF))}catch(e){}tlKeySync();layoutTL();if(mode==="timeline"){renderTimeline();apply();}}
var BASE=[
{id:"gov",p:null,t:"United States government",s:"Federal branches",k:"root",d:["The two branches that matter most for UAP work: the executive branch runs the offices, and Congress creates and funds them."]},
{id:"pres",p:"gov",t:"The President",s:"Executive branch",d:["Heads the executive branch. Every UAP office sits inside an executive agency, reporting up through the Department of Defense, the intelligence community, or NASA."]},
{id:"congress",p:"gov",t:"Congress",s:"Legislative branch",d:["Creates and funds UAP offices, mainly through the annual National Defense Authorization Act (NDAA) and intelligence authorization acts.","The FY2022 NDAA required a dedicated UAP office, and the FY2023 NDAA wrote AARO and its duties into law, including a review of the government's historical UAP record."]},
{id:"armed",p:"congress",t:"Armed Services committees",s:"House and Senate",d:["Write the NDAA, the yearly defense bill that has carried most UAP legislation, including the provisions that established and expanded AARO."]},
{id:"intel",p:"congress",t:"Intelligence committees",s:"House and Senate",d:["Oversee ODNI and the intelligence agencies. The Senate Intelligence Committee's report on the FY2021 Intelligence Authorization Act requested the unclassified UAP assessment that ODNI released in June 2021."]},
{id:"oversight",p:"congress",t:"House Oversight Committee",s:"Public hearings",d:["Held high-profile UAP hearings in July 2023, with former intelligence officer David Grusch and Navy pilots Ryan Graves and David Fravor, and again in November 2024."]},
{id:"odni",p:"pres",t:"ODNI",s:"Director of National Intelligence",rel:[["tree","interagency","Works with AARO"]],d:["Leads the intelligence community. Released the June 2021 Preliminary Assessment, which reviewed 144 military UAP reports and could explain only one.","Co-produces the annual UAP reports to Congress with AARO."]},
{id:"dod",p:"pres",t:"Department of Defense",s:"Also styled Department of War",d:["Houses nearly all UAP work, past and present. A September 2025 executive order authorized \"Department of War\" as a secondary name."]},
{id:"nasa",p:"pres",t:"NASA",s:"Independent space agency",d:["Not part of the military chain. Took a civilian, science-first look at UAP starting in 2022."]},
{id:"nasastudy",p:"nasa",t:"UAP independent study team",s:"2022 to 2023",k:"closed",st:"Completed 2023",d:["A 16-member panel chaired by astrophysicist David Spergel. Its September 2023 report found no evidence of extraterrestrial origin and called for better data collection.","NASA also named a director of UAP research at the same time."]},
{id:"nasadir",p:"nasa",t:"Director of UAP research",s:"Mark McInerney, named 2023",au:["pp-mcinerney"],d:["NASA created this post in September 2023, when its independent study team released its report. The director leads NASA's UAP work and helps build a central database for UAP data.","The first director, Mark McInerney, was previously NASA's liaison to the Department of Defense on UAP."]},
{id:"depsec",p:"dod",t:"Deputy Secretary of Defense",s:"AARO reports here",d:["The Pentagon's second-ranking official. Deputy Secretary Kathleen Hicks set up both AOIMSG in 2021 and AARO in 2022, and AARO reports to this office."]},
{id:"aaro",p:"depsec",t:"AARO",s:"All-domain Anomaly Resolution Office",k:"active",st:"Active, 2022 to now",d:["Created in July 2022 as the successor to AOIMSG, and written into law by the FY2023 NDAA. Investigates UAP in the air, at sea, in space, and on land, and reviews the government's historical UAP record.","Its March 2024 Historical Record Report (Volume 1) found no evidence that any government investigation had confirmed extraterrestrial technology, or of hidden reverse-engineering programs.","First director: physicist Sean Kirkpatrick (2022 to 2023). Current director: Jon T. Kosloski. AARO works jointly with ODNI on intelligence reporting."]},
{id:"interagency",p:"aaro",t:"Interagency partners",s:"ODNI, DOE, FBI",rel:[["tree","odni","Co-produces the annual UAP reports"],["tree","doe","Nuclear sites and national labs"],["tree","fbi","Domestic reports and law enforcement"]],d:["AARO coordinates directly with agencies outside the Pentagon, including the Office of the Director of National Intelligence (ODNI), the Department of Energy, and the Federal Bureau of Investigation (FBI), as part of a unified government reporting framework.","It produces the annual consolidated UAP reports to Congress together with ODNI, and shares cases with partner agencies so reports from different sources end up in one place."]},
{id:"usdis",p:"dod",t:"USD for Intelligence and Security",s:"Under Secretary, USD(I&S)",d:["The Pentagon's top intelligence official. Oversaw the UAP Task Force and AOIMSG, and AARO was first set up within this office in July 2022 before its reporting line moved to the Deputy Secretary."]},
{id:"aoimsg",p:"usdis",t:"AOIMSG",s:"Nov 2021 to Jul 2022",k:"closed",st:"Closed, replaced by AARO",d:["Airborne Object Identification and Management Synchronization Group. Created to replace the UAP Task Force, then expanded and renamed AARO eight months later."]},
{id:"dia",p:"dod",t:"Defense Intelligence Agency",s:"Military intelligence",d:["The DoD's main foreign military intelligence agency. Funded and managed the AAWSAP contract."]},
{id:"aawsap",p:"dia",t:"AAWSAP",s:"2008 to 2010",k:"closed",st:"Closed 2010",d:["Advanced Aerospace Weapon System Applications Program. A roughly $22 million DIA contract with Bigelow Aerospace Advanced Space Studies (BAASS), championed by Senator Harry Reid.","Produced 38 technical research papers on advanced aerospace concepts.","The contractor's owner, Robert Bigelow, also owned Skinwalker Ranch in Utah, which became the program's main field research site. That's why AAWSAP links to the ranch on the map."]},
{id:"aatip",p:"dia",t:"AATIP",s:"About 2007 to 2012",k:"closed",st:"Closed 2012 (disputed)",d:["Advanced Aerospace Threat Identification Program, made public by The New York Times in December 2017. The name is often used interchangeably with AAWSAP.","The Pentagon says funding ended in 2012. Luis Elizondo says he ran it until he resigned in 2017, which the DoD disputes."]},
{id:"navy",p:"dod",t:"Navy and Office of Naval Intelligence",s:"Department of the Navy",d:["Navy aviators recorded the FLIR1 (\"Tic Tac\", 2004), Gimbal, and GoFast (2015) videos, which the Pentagon officially released in April 2020.","In 2019 the Navy created formal guidelines for pilots to report UAP."]},
{id:"uaptf",p:"navy",t:"UAP Task Force",s:"Aug 2020 to Nov 2021",k:"closed",st:"Closed 2021",d:["Led by the Navy under USD(I&S) oversight, approved by Deputy Secretary David Norquist. Its case data fed the June 2021 ODNI preliminary assessment."]},
{id:"af",p:"dod",t:"Air Force",s:"Department of the Air Force",d:["Ran the government's first long-running UFO investigations, from the late 1940s to 1969."]},
{id:"bluebook",p:"af",t:"Sign, Grudge, Blue Book",s:"1948 to 1969",k:"closed",st:"Closed 1969",d:["Project Sign (1948) became Project Grudge (1949), then Project Blue Book (1952). Blue Book logged 12,618 reports, 701 of which stayed unidentified.","Closed in 1969 after the University of Colorado's Condon Report concluded further study was unlikely to be productive."]},
{id:"army",p:"dod",t:"Army",s:"Department of the Army",d:["Its Corps of Engineers ran the Manhattan Project through the Manhattan Engineer District."]},
{id:"manhattan",p:"army",t:"Manhattan Project",s:"1942 to 1946",k:"secret",st:"1942 to 1946",v:"Confirmed",d:["The secret effort to build the atomic bomb, led by Gen. Leslie Groves, with J. Robert Oppenheimer directing the Los Alamos lab. More than 100,000 people worked on it, most without knowing its purpose.","It produced the Trinity test in July 1945 and the bombs dropped on Hiroshima and Nagasaki. Its sites are pinned on the map."]},
{id:"darpa",p:"dod",t:"DARPA",s:"Defense Advanced Research Projects Agency",d:["Created in 1958 as ARPA in response to the Soviet Sputnik launch, and renamed DARPA in 1972. It funds high-risk research that led to the internet's forerunner ARPANET, stealth aircraft, GPS receivers, and drones.","It has no known UAP program, but it is often mentioned in discussions of advanced aerospace research and secret technology."]},
{id:"immcon",p:"dod",t:"Immaculate Constellation",s:"Alleged UAP data program",k:"secret",st:"Alleged; Pentagon denies it",v:"Disputed",rel:[["timeline","tl-hearing24","Revealed at the 2024 hearing"],["tree","aaro","The Pentagon's official UAP office"]],d:["Described in a 12-page report that journalist Michael Shellenberger gave Congress, and that Rep. Nancy Mace entered into the record at a House Oversight hearing on November 13, 2024. The report claims an unacknowledged special access program has collected high-quality UAP images and sensor data from military and intelligence sources, hidden from Congress.","The report's author was later identified as Matthew Brown, a former Pentagon official, who has since spoken publicly. The Pentagon denies the program exists."]},
{id:"pursue",p:"dod",t:"PURSUE",s:"Presidential Unsealing and Reporting System for UAP Encounters",k:"active",st:"Public releases since May 2026",rel:[["timeline","tl-pursue","Launched May 2026"],["tree","aaro","The Pentagon's UAP office"]],d:["The effort behind WAR.GOV/UFO, the Department of War's public archive of declassified UAP files, launched on May 8, 2026 after a presidential directive earlier that year.","It has posted batches of records roughly monthly, including military videos, Apollo-era documents, and FBI witness interviews. Critics note that many files lack the context needed to judge them."]},
{id:"ida",p:"dod",t:"IDA",s:"Institute for Defense Analyses",d:["A nonprofit founded in 1956 in the Washington area that runs federally funded research centers for the Pentagon, doing systems analysis, weapons testing evaluation, and science and technology studies. It hosted the JASON science advisory group in the 1960s.","Harald Malmgren worked there in the early 1960s, and later claimed knowledge of a 1962 UFO shootdown. IDA has no known UAP program."]},
{id:"rand",p:"dod",t:"RAND",s:"RAND Corporation",d:["A nonprofit research organization that began in 1946 as Project RAND, an Air Force partnership with Douglas Aircraft, and became independent in 1948. It runs federally funded research centers for the Air Force, the Army, and the Defense Department.","Its 2023 study Not the X-Files mapped 101,151 public UAP reports from 1998 to 2022 and found they were more common within about 30 km of military operations areas, the airspace used for military flight training. It suggested many such reports may be authorized military aircraft and recommended outreach to people living nearby. Its researchers have also argued that antigovernment rhetoric harms serious UAP research."],rel:[["timeline","tl-rand23","Not the X-Files, 2023"]]},
{id:"jcs",p:"dod",t:"Joint Chiefs of Staff",s:"Top military advisers",d:["The senior uniformed leaders of each service, who advise the President and Secretary of Defense."]},
{id:"paperclip",p:"jcs",t:"Operation Paperclip",s:"1945 to 1959",k:"secret",st:"1945 to 1959",v:"Confirmed",d:["Run by the Joint Intelligence Objectives Agency, it brought more than 1,600 German scientists and engineers to the U.S., some with Nazi pasts.","Wernher von Braun's rocket team worked at Fort Bliss, then Redstone Arsenal in Huntsville, and went on to build the Saturn V."]},
{id:"northwoods",p:"jcs",t:"Operation Northwoods",s:"1962 proposal",k:"secret",st:"Proposed 1962, rejected",v:"Confirmed",d:["A Joint Chiefs plan for staged attacks that would be blamed on Cuba to justify an invasion. The Kennedy administration rejected it.","The documents were declassified in 1997."]},
{id:"mogul",p:"af",t:"Project Mogul",s:"1947 to 1949",k:"secret",st:"1947 to 1949",v:"Confirmed",d:["Top-secret trains of balloons carrying microphones to listen for Soviet nuclear tests, launched from Alamogordo, New Mexico.","The Air Force's 1994 report concluded a Mogul flight was the most likely source of the Roswell debris."]},
{id:"stargate",p:"dia",t:"Stargate Project",s:"1978 to 1995",k:"secret",st:"1978 to 1995",v:"Confirmed",d:["Army, DIA, and CIA research into remote viewing, or psychic spying, which began at SRI International in 1972 under earlier names like Gondola Wish and Grill Flame.","A 1995 CIA-sponsored review concluded it never produced useful intelligence, and the program was closed."]},
{id:"oss",p:"pres",t:"OSS",s:"Office of Strategic Services",k:"closed",st:"1942 to 1945",rel:[["tree","cia","Its successor"],["map","m-bsc","Trained with British intelligence"]],d:["America's wartime intelligence and sabotage agency, led by William \"Wild Bill\" Donovan. It was built with heavy help from British Security Coordination and William Stephenson.","Disbanded in 1945, its people and methods passed to the CIA when it was created in 1947."]},
{id:"cia",p:"pres",t:"CIA",s:"Central Intelligence Agency",d:["Created by the National Security Act of 1947. Many of its Cold War programs came to light in the 1970s through the Church Committee, the Rockefeller Commission, and the CIA's own internal Family Jewels report."]},
{id:"robertson",p:"cia",t:"Robertson Panel",s:"1953",k:"closed",st:"1953",v:"Confirmed",d:["A panel of scientists convened by the CIA to review UFO reports. It concluded they posed no direct threat and recommended public education to reduce interest in the subject.","Its report shaped how Project Blue Book handled cases for years afterward."]},
{id:"mkultra",p:"cia",t:"MKUltra",s:"1953 to 1973",k:"secret",st:"1953 to 1973",v:"Confirmed",d:["The CIA tested LSD, hypnosis, and other mind-control methods, often on people who didn't know or hadn't consented.","Most records were destroyed in 1973, but about 20,000 surviving documents were found in 1977 and examined in Senate hearings that year."]},
{id:"mockingbird",p:"cia",t:"Operation Mockingbird",s:"Media influence",k:"secret",st:"1963 wiretap confirmed, wider claims debated",v:"Partly confirmed",d:["The CIA's Family Jewels documents show Project Mockingbird was a 1963 wiretap of two Washington journalists.","The Church Committee separately found the CIA had relationships with about 50 U.S. journalists. Whether this was one organized program called Mockingbird is debated."]},
{id:"azorian",p:"cia",t:"Project Azorian",s:"1974",k:"secret",st:"1974",v:"Confirmed",d:["The CIA used the Hughes Glomar Explorer, disguised as a deep-sea mining ship, to raise part of the sunken Soviet submarine K-129 from about 16,000 feet down in the Pacific.","Press questions about it produced the phrase \"neither confirm nor deny.\""]},
{id:"doe",p:"pres",t:"Department of Energy",s:"Nuclear weapons and national labs",rel:[["tree","interagency","Works with AARO"],["tree","aec","Took over its duties"]],d:["Runs the nuclear weapons complex and national labs such as Los Alamos, Sandia, and Oak Ridge. UAP reports near nuclear sites make it one of AARO's partner agencies."]},
{id:"fbi",p:"pres",t:"FBI",s:"Federal Bureau of Investigation",rel:[["tree","interagency","Works with AARO"]],d:["Part of the Department of Justice. Collected flying saucer reports in 1947 under J. Edgar Hoover, and its UFO files are public in the FBI Vault.","Today it is one of AARO's partner agencies, passing along reports from domestic sources and law enforcement."]},
{id:"aec",p:"pres",t:"Atomic Energy Commission",s:"1947 to 1974, now DOE",d:["Took over the Manhattan Project's labs and sites in 1947. Its duties later passed to the Department of Energy, which still runs Los Alamos, Oak Ridge, and Hanford."]},
{id:"nsc",p:"pres",t:"National Security Council",s:"Created 1947",d:["The President's main forum for national security and foreign policy, created by the National Security Act of 1947. It approved covert operations through a series of small, secret review groups."]},
{id:"nsc5412",p:"nsc",t:"5412 Committee",s:"Special Group, 1955 to 1970s",k:"secret",st:"1955, renamed 1964 and 1970",v:"Confirmed",rel:[["tree","cia","Its covert operations were reviewed here"],["tree","mj12","Sometimes linked in UFO lore"]],d:["Created in December 1955 under President Eisenhower by National Security Council directive 5412/2. A small panel of senior officials, usually the President's representative and deputies from State and Defense, met with the CIA director to approve or reject covert operations.","Also called the Special Group, it was renamed the 303 Committee in 1964 and the 40 Committee in 1970. Its existence was confirmed by the Church Committee in the 1970s.","Some UFO researchers have suggested a secret group like this could have overseen UFO matters, and the disputed Majestic 12 papers are sometimes tied to it. No documents link the 5412 Committee to UFOs."]},
{id:"nara",p:"pres",t:"National Archives",s:"UAP Records Collection",d:["The federal government's record keeper. The FY2024 defense bill, a pared-down version of the UAP Disclosure Act, created a UAP Records Collection here, barred agencies from destroying UAP records, and set a 25-year limit on keeping them secret. Agencies were required to transfer their UAP records."]},
{id:"mj12",p:"pres",t:"Majestic 12",s:"Alleged 1947 committee",k:"secret",st:"Documents considered fake",v:"Disputed",rel:[["timeline","tl-coverup88","1988 TV special"],["timeline","tl-moore89","Bill Moore's 1989 confession"]],d:["Claimed to be a secret group of officials created by President Truman to manage crashed-saucer recoveries. The documents surfaced in the 1980s.","The FBI concluded they were fake, and the National Archives found no record of the group."]}
];
