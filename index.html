h1 .vt{font-family:Barlow,"Helvetica Neue",Arial,sans-serif;font-weight:400;font-style:normal;font-size:14px;letter-spacing:0;color:var(--ink2)}
.tools{display:flex;gap:6px;align-items:center}
button{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--hair);border-radius:6px;padding:6px 11px;cursor:pointer;min-height:36px}
button:hover{border-color:var(--line)}
button:focus-visible,textarea:focus-visible,input:focus-visible,.node:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button[aria-pressed="true"]{background:var(--amber-bg);border-color:var(--amber);color:var(--ink)}
.sq{width:36px;padding:0;font-size:18px}
#vp{flex:1;position:relative;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;background-color:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px)}
#vp.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.e{fill:none;stroke:var(--line);stroke-width:1.5}
.lin{fill:none;stroke:var(--amber);stroke-width:2;stroke-dasharray:6 5}
.node{position:absolute;width:210px;min-height:78px;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px 10px;cursor:pointer;user-select:none;-webkit-user-select:none}
.node:hover{border-color:var(--ink2)}
.node .t{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:18px;line-height:1.1;margin:0}
.node .s{font-size:13px;color:var(--ink2);margin:3px 0 0;line-height:1.3}
.node.active{border-color:var(--amber);border-width:2.5px;background:var(--amber-bg)}
.node.closed{border-style:dashed;border-color:var(--closed)}
.node.closed .t{color:var(--ink2)}
.node.root{background:var(--ink);border-color:var(--ink)}
.node.root .t,.node.root .s{color:var(--bg)}
.node.custom{border-style:dotted;border-width:2px}
.node.sel{box-shadow:0 0 0 3px var(--focus)}
.dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--amber)}
.legend{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--hair);border-radius:8px;padding:8px 11px;font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:5px;z-index:2;pointer-events:none}
.legend span{display:flex;align-items:center;gap:8px}
.legend span[hidden]{display:none}
.fkey{pointer-events:auto;gap:2px;padding:6px 6px 8px;background:#F7F3EA;border-color:rgba(20,28,45,.16);color:#1C2433;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.fkey button{display:flex;align-items:center;gap:8px;background:none;border:0;border-radius:5px;padding:3px 6px;min-height:0;font:inherit;color:#1C2433;text-align:left;cursor:pointer}
.fkey button:hover{background:rgba(20,28,45,.07)}
.fkey [data-k][aria-pressed="false"]{color:#5B6475;text-decoration:line-through}
.fkey [data-k][aria-pressed="false"] i{opacity:.4}
.fkey .lg-gov,.fkey .lg-mine{box-shadow:0 0 0 1px rgba(20,28,45,.45)}
.fkey .sw{background:#FBFCFD;border-color:#8395AA}.fkey .sw.a{background:#FCF1DF;border-color:#B86E0E}.fkey .sw.c{background:#FBFCFD;border-color:#8A96A4}.fkey .sw.s{background:#EFE9FA;border-color:#6E4BB0}
.fkey .kn{margin-left:auto;padding-left:10px;font-size:11.5px;color:#5B6475}
.tlkall{display:flex!important;gap:4px;margin-top:4px;border-top:1px solid rgba(20,28,45,.14);padding-top:6px}
.tlkall button{font-size:12px;color:#2D3A55;text-decoration:underline;padding:2px 6px}
.tlkall button:disabled{color:#8A91A0;cursor:default;text-decoration:none}
.sw{width:22px;height:13px;border-radius:3px;border:1.5px solid var(--line);background:var(--card)}
.sw.a{border:2.5px solid var(--amber);background:var(--amber-bg)}
.sw.c{border-style:dashed;border-color:var(--closed)}
.sw.l{border:0;height:0;border-top:2px dashed var(--amber);border-radius:0;background:none}
.hint{position:absolute;right:12px;bottom:12px;font-size:12.5px;color:var(--ink2);z-index:2;pointer-events:none;text-align:right;max-width:46%}
#panel{position:absolute;top:0;right:0;bottom:0;width:min(380px,100%);background:var(--panel);border-left:1px solid var(--hair);z-index:4;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease}
#panel.open{transform:none}
@media (max-width:640px){#panel{top:auto;left:0;width:100%;height:68%;border-left:0;border-top:1px solid var(--hair);border-radius:14px 14px 0 0;transform:translateY(105%)}.hint{display:none}}
@media (prefers-reduced-motion:reduce){#panel{transition:none}}
.ph{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--hair)}
.ph h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:24px;line-height:1.1;margin:0}
.ph p{margin:3px 0 0;color:var(--ink2);font-size:14px}
.pb{padding:14px 16px 20px;overflow-y:auto;flex:1}
.pill{display:inline-block;font-size:12.5px;padding:2px 9px;border-radius:20px;border:1px solid var(--hair);color:var(--ink2);margin-bottom:10px}
.pill.a{background:var(--amber-bg);border-color:var(--amber);color:var(--ink)}
.facts{margin:0 0 18px;max-width:62ch}
.facts p{margin:0 0 10px}
h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:17px;margin:18px 0 6px}
textarea,input{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--hair);border-radius:6px;padding:8px 10px}
textarea{min-height:120px;resize:vertical}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center}
.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.status{font-size:13px;color:var(--ink2)}
.danger{color:#B3261E}
.err{font-size:13px;color:#B3261E;margin-top:4px;min-height:1em}

.seg{display:inline-flex;border:1px solid var(--hair);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:36px;background:var(--card)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.chip{font-size:13px;padding:4px 10px;min-height:32px;border-radius:16px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="false"]{opacity:.55;text-decoration:line-through}
.chip[aria-pressed="true"]{background:var(--card);border-color:var(--line);color:var(--ink)}
#world,#mapw,#tlw{transition:opacity .25s ease-in-out,visibility 0s linear 0s}
body:not(.mode-tree) #world,body:not(.mode-map) #mapw,body:not(.mode-timeline) #tlw{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease-in-out,visibility 0s linear .25s}
.node,.node .t,.node .s{transition:background-color .25s ease-in-out,color .25s ease-in-out,border-color .25s ease-in-out}
.e{transition:stroke .25s ease-in-out}
body,header,#vp,.legend,#panel,textarea,input,.pill,.pin .lb{transition:background-color .25s ease-in-out,color .25s ease-in-out,border-color .25s ease-in-out}
button{transition:background-color .12s ease-out,color .12s ease-out,border-color .12s ease-out}
/* view changes: like an old analog TV switching off and back on; the picture collapses to a bright line,
   then a dot, the view swaps, and it opens again */
html.crt{background:#000}
html.crt body{transform-origin:50% 50vh;transition:transform var(--crt-t,0s) cubic-bezier(.6,0,.9,.4),filter var(--crt-t,0s) linear;pointer-events:none}
html.crt-line body{transform:scale(1,.006);filter:brightness(5) saturate(.15)}
html.crt-dot body{transform:scale(.004,.006);filter:brightness(6) saturate(0)}
#blink{position:fixed;left:50%;top:50vh;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;z-index:60;pointer-events:none;opacity:0;
  background:radial-gradient(circle,#fff 0,#E8F2FF 35%,rgba(200,225,255,0) 70%);transition:opacity .07s linear}
#blink.on{opacity:1}

.lgh .eb{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin:0 0 2px}
.lgi{color:var(--ink2);font-size:15.5px;max-width:720px;margin:6px 0 16px}
.lgf{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.lgf button{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;min-height:32px;padding:4px 11px;border-radius:20px}
.lgf button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lgf .n{font-variant-numeric:tabular-nums;opacity:.75}
.std{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--sc)}
.cl{border:1px solid var(--hair);border-left:5px solid var(--sc);border-radius:10px;background:var(--card);padding:16px 18px 12px;margin:0 0 14px;scroll-margin-top:16px}
.cl.flash{box-shadow:0 0 0 3px var(--focus)}
.clt{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px}
.clt h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:22px;line-height:1.15;margin:0;flex:1 1 320px}
.stb{display:inline-flex;align-items:center;gap:6px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--sc);border:1.5px solid var(--sc);border-radius:20px;padding:1px 10px}
.clm{font-size:13.5px;color:var(--ink2);margin:4px 0 10px}
.clm button{all:unset;cursor:pointer;color:var(--focus)}.clm button:hover{text-decoration:underline}
.clg{display:grid;grid-template-columns:1fr 1fr;gap:10px 22px}
.clg h4{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:500;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:0 0 3px}
.clg p{margin:0;font-size:15px;line-height:1.55}
.cll{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.cll button{font-size:12.5px;min-height:28px;padding:2px 9px}
.cll button .cv{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin-right:5px}
.cl details{margin-top:6px}.cl summary{cursor:pointer;font-size:13px;color:var(--ink2)}
.cl .srcs{margin-top:6px}
.clx{display:flex;flex-direction:column;gap:6px;margin:0 0 6px}
.clx button{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;text-align:left;padding:8px 10px;min-height:0;border-left:4px solid var(--sc)}
.clx .stb{font-size:11px;padding:0 7px}
@media (max-width:760px){.clg{grid-template-columns:1fr}.lg{padding:16px 16px 50px}.lgh h2{font-size:28px}}
.wled{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;width:100%;text-align:left;margin:-10px 0 22px;padding:12px 16px;border:1px solid var(--hair);border-left:4px solid var(--amber);border-radius:10px;background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.wled:hover{border-color:var(--focus);border-left-color:var(--amber)}
.wled b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:20px}
.wled span{font-size:14px;color:var(--ink2);flex:1 1 300px}
.wled em{font-style:normal;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:500;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber)}
/* quiz */
#quiz{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;display:block}
#quiz[hidden]{display:none}
.qz{max-width:760px;margin:0 auto;padding:22px 24px 60px}
.qzbar{display:flex;align-items:center;gap:12px;margin:10px 0 18px;font-size:14px;color:var(--ink2)}
.qzprog{flex:1;height:6px;border-radius:3px;background:var(--hair);overflow:hidden}
.qzprog i{display:block;height:100%;background:var(--amber);transition:width .25s ease}
.qzcard{border:1px solid var(--hair);border-radius:12px;background:var(--card);padding:20px 20px 18px}
.qzk{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);margin:0 0 6px}
.qzq{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:27px;line-height:1.15;margin:0 0 4px}
.qzsub{color:var(--ink2);font-size:15px;margin:0 0 16px}
.qzo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qzo button{text-align:left;min-height:52px;padding:10px 14px;border-radius:10px;font-size:16px;line-height:1.3;display:flex;align-items:center;gap:10px}
.qzo button:hover:not(:disabled){border-color:var(--focus)}
.qzo button:disabled{cursor:default;opacity:.55}
.qzo button.ok{opacity:1;border:2px solid var(--st-confirmed);background:color-mix(in srgb,var(--st-confirmed) 14%,var(--card))}
.qzo button.no{opacity:1;border:2px solid var(--st-false);background:color-mix(in srgb,var(--st-false) 12%,var(--card))}
.qzo .std{flex:none}
.qzr{margin:16px 0 0;padding:14px 16px;border-radius:10px;background:var(--bg);border:1px solid var(--hair);font-size:15.5px;line-height:1.5}
.qzr b.y{color:var(--st-confirmed)}.qzr b.n{color:var(--st-false)}
.qzr p{margin:6px 0 0}
.qzact{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin:16px 0 0}
.qzact .go{margin-right:auto}
.qzact .pv{margin-right:0}
.qzact .pv+.go{margin-left:0}
.qzact .pv:only-child{margin-right:auto}
.qzact .nx{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600;padding:8px 18px}
.qzend{text-align:center;padding:28px 20px;margin-top:16px}
.qzend .big{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:64px;line-height:1;margin:6px 0}
.qzend .rank{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:600;font-size:26px;color:var(--amber);margin:0 0 6px}
.qzend p{color:var(--ink2);max-width:520px;margin:6px auto 18px}
.qzend .qzact{justify-content:center}
.wquiz{border-left-color:var(--st-confirmed)}
.lgquiz{align-self:center;border-color:var(--amber);color:var(--amber);font-weight:600}
@media (max-width:640px){.qz{padding:16px 16px 50px}.qzo{grid-template-columns:1fr}.qzq{font-size:23px}.qzcard{padding:16px 14px}}

/* drag the panel's left edge to resize it */
.pgrip{position:absolute;left:0;top:0;bottom:0;width:16px;margin-left:-8px;cursor:col-resize;z-index:6;touch-action:none}
.pgrip::after{content:"";position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--focus);opacity:0;transition:opacity .15s}
.pgrip::before{content:"";position:absolute;left:5px;top:50%;width:6px;height:36px;margin-top:-18px;border-radius:3px;background:var(--line);opacity:.55;transition:opacity .15s}
.pgrip:hover::after,.pgrip:focus-visible::after,.pgrip.drag::after{opacity:1}.pgrip:hover::before,.pgrip.drag::before{opacity:.9}
.pgrip:focus-visible{outline:none}
body.pdrag,body.pdrag *{cursor:col-resize!important;user-select:none!important}
body.pdrag #panel{transition:none}
@media (max-width:640px){.pgrip{display:none}}
/* phones: compact two-row header, and the key folds away behind a Key button */
.keybtn{display:none}
.sgrip{display:none}
@media (max-width:640px){
header{gap:6px 6px;padding:8px 10px}
h1{margin:0 auto 0 0}
h1 .vt{display:none}
header .brand .lgm{height:21px}
header .tools{display:contents}
header .tools>.seg{order:0}
header .tools .seg button{min-height:32px;padding:4px 9px;font-size:13.5px;white-space:nowrap}
.srch{order:1;flex:1 1 170px;min-width:0}
#q{font-size:16px;min-height:34px;padding:4px 12px 4px 32px}
#ledgerBtn,#fit{order:2;min-height:34px;padding:4px 10px;font-size:13.5px}
#zo,#zi{display:none}
header>.tb{order:3;flex-wrap:nowrap;overflow-x:auto;gap:5px;scrollbar-width:none}
header>.tb::-webkit-scrollbar{display:none}
header>.tb .tb{flex-wrap:nowrap}
header>.tb button{min-height:30px;padding:3px 10px;font-size:13px;white-space:nowrap;flex:none}
header>.tb .seg button{min-height:30px}
.keybtn{display:flex;align-items:center;gap:7px;position:absolute;left:10px;bottom:10px;z-index:3;min-height:36px;padding:4px 12px;font-size:13.5px;border-radius:18px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.keybtn i{display:block;width:14px;height:10px;background:linear-gradient(var(--ink2) 0 2px,transparent 2px 4px,var(--ink2) 4px 6px,transparent 6px 8px,var(--ink2) 8px 10px)}
#vp .legend{display:none;left:10px;bottom:54px;max-height:calc(100% - 66px);overflow-y:auto}
body.keyopen #vp .legend{display:flex}
#vp .fkey button{padding:6px 8px}
body.mode-tree header>.tb{order:2;width:auto;flex:none}
body.mode-tree .srch{flex-basis:110px}
#panel{position:fixed;z-index:7;height:var(--ph,60%);max-height:100%}
#panel.full{border-radius:0}
#panel.sdrag{transition:none}
.sgrip{display:block;position:absolute;left:0;right:0;top:0;height:22px;z-index:5;touch-action:none;cursor:ns-resize}
.sgrip::before{content:"";position:absolute;left:50%;top:7px;width:40px;height:5px;margin-left:-20px;border-radius:3px;background:var(--line);opacity:.7}
#panel .ph{padding-top:22px;touch-action:none}
}

<script id="mapdata" type="application/json">{"pins":[{"id":"w-tunguska","c":"uap","t":"Tunguska event","s":"Central Siberia, Russia, 1908","lat":60.886,"lon":101.894,"d":"On June 30, 1908, an air burst flattened millions of trees across more than 2,000 square km of taiga. Scientists attribute it to a meteor, but a 1946 science fiction story made it a famous alien spaceship legend.","u":0},{"id":"w-dyatlov","c":"uap","t":"Dyatlov Pass","s":"Northern Urals, Russia, 1959","lat":61.755,"lon":59.462,"d":"Nine hikers died here in February 1959 after fleeing their tent at night. Reports of orange spheres fed UFO theories, but Russian investigators concluded in 2020 that an avalanche was the most likely cause.","u":0},{"id":"w-carman","c":"uap","t":"Charlie Redstar","s":"Carman, Manitoba, Canada, 1975","lat":49.5,"lon":-98.0,"d":"In 1975 people around this prairie town reported a red ball of light, nicknamed Charlie Redstar, for months, and crowds gathered in fields to watch for it.","u":0},{"id":"w-falconbridge","c":"mil","t":"CFS Falconbridge","s":"Near Sudbury, Ontario, Canada, 1975","lat":46.58,"lon":-80.8,"d":"A Canadian air defence radar station. On November 11, 1975, its staff tracked a brilliantly lit object on radar and watched it through binoculars, according to a NORAD report.","u":1},{"id":"w-foxlake","c":"uap","t":"Yukon mothership sighting","s":"Fox Lake, Yukon, Canada, 1996","lat":61.25,"lon":-135.47,"d":"On December 11, 1996, at least 31 people along the Klondike Highway reported an enormous craft with rows of lights. A satellite analyst later matched it to a re-entering Soviet rocket stage.","u":0},{"id":"w-stpaul","c":"civ","t":"St. Paul UFO landing pad","s":"St. Paul, Alberta, Canada, 1967","lat":53.99,"lon":-111.3,"d":"Built for Canada's centennial and opened in 1967 by defence minister Paul Hellyer, as a symbol of keeping space free of war.","u":0},{"id":"m-johnston","c":"mil","t":"Johnston Atoll","s":"Central Pacific, nuclear test site 1958 and 1962","d":"A U.S. military atoll about 1,300 km (800 miles) southwest of Hawaii. In 1962 it was the launch site for Operation Fishbowl, a series of high-altitude nuclear tests carried on Thor rockets, including Starfish Prime and Bluegill Triple Prime. One failed launch, Bluegill Prime, exploded on the pad in July 1962 and contaminated the island with plutonium.","u":0,"lat":16.7295,"lon":-169.5336},{"id":"m-baltic","c":"uap","t":"Baltic Sea anomaly","s":"Gulf of Bothnia, between Sweden and Finland, 2011","d":"A roughly 60-meter round shape on the seabed, about 90 meters down, seen on side-scan sonar by Swedish treasure hunters Peter Lindberg and Dennis Åsberg of Ocean X in June 2011. Its saucer-like look drew comparisons to the Millennium Falcon and claims of a crashed craft or ancient structure. Stockholm University geologist Volker Brüchert found the recovered samples were granite, gneiss, and sandstone, and experts consider it a natural glacial rock formation. The pin uses the coordinates circulated online, 61°22.6'N 18°26.9'E; Ocean X has not officially confirmed them.","u":0,"lat":61.3767,"lon":18.4483},{"id":"m-teslacs","c":"civ","t":"Tesla's Colorado Springs lab","s":"Colorado Springs, Colorado, 1899 to 1900","d":"Where Nikola Tesla built a giant experimental station to study wireless power and lightning. In 1899 he recorded faint, regular signals on his receivers that he came to believe were messages from another planet, likely Mars or Venus. The lab was torn down in 1904.","u":0,"lat":38.8253,"lon":-104.8196},{"id":"m-roundtable","c":"civ","t":"Round Table Foundation","s":"Glen Cove, Maine, late 1940s to late 1950s","d":"Andrija Puharich's private research estate, where he studied psychics, mediums, and mind-altering substances with wealthy backers and some military interest. A 1952 session here produced the first messages from beings calling themselves the Nine, which later shaped parts of the 1970s New Age and contactee scene.","u":0,"lat":44.1251,"lon":-69.1023},{"id":"m-apro","c":"civ","t":"APRO headquarters","s":"Tucson, Arizona, 1960 to 1988","d":"The Aerial Phenomena Research Organization, one of the earliest civilian UFO groups, founded by Jim and Coral Lorenzen in Sturgeon Bay, Wisconsin, in 1952 and run from Tucson from 1960. It was known for field investigations and its newsletter, the APRO Bulletin, and was more open than NICAP to occupant and abduction reports. Bill Moore was its research director. It folded after Coral Lorenzen's death in 1988.","u":0,"lat":32.2226,"lon":-110.9747},{"id":"m-dulce","c":"sec","t":"Dulce Base (alleged)","s":"Archuleta Mesa, near Dulce, New Mexico","d":"UNVERIFIED: supposed underground alien and human base inside Archuleta Mesa on the Jicarilla Apache Nation. The story began with Paul Bennewitz in the early 1980s, partly built on disinformation fed to him by Air Force agents, and grew through later retellings. No evidence of a base has ever surfaced.","u":0,"lat":36.98,"lon":-106.95},{"id":"m-bsc","c":"sec","t":"British Security Coordination","s":"Rockefeller Center, New York City, 1940 to 1946","d":"Headquarters of Britain's secret intelligence network in the Americas during World War II, run by Canadian William Stephenson, code name Intrepid, from offices in the International Building at Rockefeller Center. Operating under cover of the British Passport Control Office, it ran counterespionage, propaganda, and covert operations to move the U.S. away from isolationism, and helped train the Americans who formed the OSS.","u":0,"lat":40.7587,"lon":-73.9779},{"id":"m-strieber","c":"uap","t":"Strieber's cabin (Communion)","s":"Near Pine Bush, Ulster County, New York, December 26, 1985","d":"Horror novelist Whitley Strieber says that on the night after Christmas 1985 he was taken from his upstate New York cabin by beings he called \"the visitors,\" and he described being examined. His 1987 book Communion, with its cover painting of a gray-skinned, large-eyed being, became a No. 1 bestseller and shaped the popular image of the \"Grey\" alien. Skeptics such as neurologist Steven Novella point to sleep paralysis and hypnagogic experiences. UNVERIFIED. The pin marks the approximate area.","u":0,"lat":41.64,"lon":-74.34},{"id":"m-hall","c":"uap","t":"Charles Hall's \"Tall Whites\"","s":"Indian Springs, Nevada, 1960s","d":"Charles James Hall says that as an Air Force weather observer on the Nellis ranges near Indian Springs (now Creech Air Force Base) in the mid-1960s, he repeatedly met tall, pale, humanlike beings he calls the \"Tall Whites,\" who he says kept craft at a hidden base in the area. He told the story in his Millennial Hospitality books starting in 2002. UNVERIFIED: no records or other witnesses have confirmed his account.","u":0,"lat":36.587,"lon":-115.673},{"id":"m-bledsoe","c":"uap","t":"Bledsoe Cape Fear sighting","s":"Cape Fear River near Fayetteville, North Carolina, January 2007","d":"Chris Bledsoe, a home builder struggling with Crohn's disease and a failing business, says that while fishing on the Cape Fear River with his son and coworkers in early January 2007 he saw glowing orbs, encountered small beings, lost about four hours, and was later healed of his illness. His son and coworkers reported seeing lights. Bledsoe says the encounters continued, and he has since drawn visits from scientists, military officers, and members of Congress. His account is told in his 2023 book UFO of God. UNVERIFIED: the core claims rest on his and his family's testimony. The pin marks the approximate area.","u":0,"lat":34.97,"lon":-78.86},{"id":"m-coyne","c":"uap","t":"Coyne helicopter incident","s":"Near Mansfield, Ohio, October 18, 1973","d":"An Army Reserve UH-1H medical helicopter flying from Columbus to Cleveland, commanded by Capt. Lawrence Coyne, met a red light that closed on it at high speed. The crew said a gray, cigar-shaped object stopped over the helicopter, bathed it in green light, and that the aircraft climbed from about 1,700 to 3,500 feet even though Coyne had put it into a dive. Witnesses on the ground reported a similar object. The crew filed an official Army report, and the case is considered one of the best-documented military encounters. Skeptics have suggested an Orionid meteor; the case remains unexplained.","u":0,"lat":40.82,"lon":-82.45},{"id":"a-serpent","c":"anc","t":"Serpent Mound","s":"Peebles, Ohio, about 300 BC or AD 1070","d":"A 1,348-foot earthen effigy of a snake with a coiled tail and an oval at its head, the largest serpent effigy in the world. Archaeologists debate whether the Adena or the later Fort Ancient culture built it. Its head appears to align with the summer solstice sunset. It sits on the edge of an ancient impact crater, which has fueled alternative theories. Part of a UNESCO World Heritage listing with Ohio's Hopewell earthworks.","u":0,"lat":39.0253,"lon":-83.4303},{"id":"a-newark","c":"anc","t":"Newark Earthworks","s":"Newark, Ohio, about AD 1 to 400","d":"The largest set of geometric earthen enclosures in the world, built by the Hopewell culture: a great circle and an octagon joined to a circle. The Octagon tracks the 18.6-year cycle of moonrises and moonsets with remarkable precision. A UNESCO World Heritage Site since 2023.","u":0,"lat":40.0533,"lon":-82.4433},{"id":"a-chaco","c":"anc","t":"Chaco Canyon","s":"New Mexico, about AD 850 to 1150","d":"The center of Ancestral Puebloan culture, with multistory great houses like Pueblo Bonito and long straight roads. Several buildings align with solar and lunar cycles, and the \"Sun Dagger\" petroglyph on Fajada Butte marks solstices and equinoxes with daggers of light. A UNESCO World Heritage Site.","u":0,"lat":36.0604,"lon":-107.9615},{"id":"a-mesaverde","c":"anc","t":"Mesa Verde","s":"Colorado, about AD 600 to 1300","d":"Ancestral Puebloan villages built into cliff alcoves, including the 150-room Cliff Palace. The people left by about 1300, likely because of drought. A UNESCO World Heritage Site.","u":0,"lat":37.1838,"lon":-108.4887},{"id":"a-poverty","c":"anc","t":"Poverty Point","s":"Pickering, Louisiana, about 1700 to 1100 BC","d":"Huge concentric earthen ridges and mounds built by hunter-gatherers, one of the oldest large earthworks in the Americas. Its main mound took an estimated eight million basketloads of soil. A UNESCO World Heritage Site.","u":0,"lat":32.6366,"lon":-91.4067},{"id":"a-mysteryhill","c":"anc","t":"Mystery Hill (\"America's Stonehenge\")","s":"Salem, New Hampshire","d":"A maze of stone walls, chambers, and a large grooved \"sacrificial table\" promoted since the 1930s as a pre-Columbian or even ancient European site with astronomical alignments. DISPUTED: archaeologists generally attribute the structures to 18th- and 19th-century farmers, with later rearrangement by enthusiasts.","u":0,"lat":42.8424,"lon":-71.2073},{"id":"a-medicinewheel","c":"anc","t":"Bighorn Medicine Wheel","s":"Bighorn Mountains, Wyoming, about 300 to 800 years old","d":"A stone circle about 80 feet across with 28 spokes, sacred to many Plains tribes and still used for ceremonies. Some researchers argue its cairns align with the summer solstice sunrise and certain bright stars. A National Historic Landmark.","u":0,"lat":44.8263,"lon":-107.9213},{"id":"m-omaha","c":"uap","t":"USS Omaha sphere","s":"Off San Diego, California, July 2019","d":"Navy personnel aboard the littoral combat ship USS Omaha filmed a dark spherical object on the ship's infrared system as it flew near the ship and then appeared to drop into the sea. The video was released by filmmaker Jeremy Corbell in 2021, and the Pentagon confirmed it was taken by Navy personnel. A search reportedly found nothing in the water. It is often cited as a possible transmedium or unidentified submerged object (USO) case; the object remains unidentified, and skeptics have suggested a balloon or drone. The pin marks the approximate area.","u":0,"lat":32.55,"lon":-117.6},{"id":"m-aguadilla","c":"uap","t":"Aguadilla thermal video","s":"Aguadilla, Puerto Rico, April 2013","d":"A U.S. Customs and Border Protection aircraft recorded thermal video of a small object crossing Rafael Hernández Airport at low altitude, then over the ocean, where it appeared to enter and leave the water. A 2015 analysis by the Scientific Coalition for UAP Studies argued it moved faster than the wind and was unexplained, making it one of the best-known transmedium or unidentified submerged object (USO) cases. Skeptics such as Mick West argue it matches a pair of sky lanterns drifting with the wind, and the water entry an effect of the camera's viewing angle. Disputed.","u":0,"lat":18.4949,"lon":-67.1294},{"id":"m-berkshire","c":"uap","t":"Berkshire UFO incident","s":"Sheffield, Massachusetts, September 1, 1969","d":"On Labor Day night, 1969, Thomas Reed and his family said a disc-shaped craft hovered over the Old Covered Bridge across the Housatonic River in Sheffield, followed their car, and pulled them aboard. Another family reported a similar encounter at Lake Mansfield in Great Barrington, and supporters say more than 250 people saw the object. Reed reportedly passed a polygraph, the town built a memorial park in 2015, and a governor's citation was later issued, though Governor Charlie Baker's office said it was signed in error. Skeptics note that no police or news report from the time has been found. The pin marks the approximate bridge location.","u":0,"lat":42.1166,"lon":-73.3439},{"id":"a-giza","c":"anc","t":"Pyramids of Giza and the Sphinx","s":"Giza, Egypt, about 2600 to 2500 BC","d":"The Great Pyramid of Khufu, the pyramids of Khafre and Menkaure, and the Great Sphinx. Archaeologists have found the workers' town, bakeries, tombs of the builders, and a logbook from one of the crews that hauled the limestone, all pointing to Egyptian builders. Ancient-astronaut writers have long claimed otherwise, but no evidence supports that.","u":0,"lat":29.9792,"lon":31.1342},{"id":"a-hawara","c":"anc","t":"Hawara labyrinth","s":"Hawara, Faiyum, Egypt, about 1800 BC","d":"The ruined pyramid of Pharaoh Amenemhat III, and beside it the site of the \"Labyrinth\" that Herodotus and Strabo described as a vast complex of some 3,000 rooms, half of them underground. Flinders Petrie excavated its foundations in 1888 and 1889. In 2008 the Mataha Expedition, a team from Egypt's NRIAG, Ghent University, and Louis De Cordier's foundation, ran a ground-penetrating radar survey that reported buried walls and structures. UNVERIFIED: in 2025, on The Joe Rogan Experience, researcher Ben van Kerkwyk and Joe Rogan discussed claims that the scans show a large metallic \"Tic Tac\"-shaped object, some 40 meters long, in a chamber deep underground. No scan data showing such an object has been published, and Egyptologists consider the claim unsupported. Further excavation has not been permitted.","u":0,"lat":29.2737,"lon":30.8987},{"id":"a-saqqara","c":"anc","t":"Step Pyramid of Djoser","s":"Saqqara, Egypt, about 2670 BC","d":"The oldest of Egypt's large pyramids, designed by the architect Imhotep for King Djoser. It is built of six stacked stone platforms.","u":0,"lat":29.8713,"lon":31.2165},{"id":"a-dahshur","c":"anc","t":"Bent and Red Pyramids","s":"Dahshur, Egypt, about 2600 BC","d":"Two pyramids of King Sneferu, Khufu's father. The Bent Pyramid changes angle partway up, and the Red Pyramid was the first true smooth-sided pyramid.","u":0,"lat":29.7903,"lon":31.2094},{"id":"a-meroe","c":"anc","t":"Pyramids of Meroë","s":"Meroë, Sudan, about 300 BC to AD 350","d":"Nearly 200 steep-sided pyramids built by the kings and queens of the Kingdom of Kush, more than all of Egypt's.","u":0,"lat":16.9384,"lon":33.7488},{"id":"a-teotihuacan","c":"anc","t":"Teotihuacan","s":"Near Mexico City, Mexico, about AD 100 to 550","d":"An ancient city with the Pyramid of the Sun, one of the largest pyramids in the world, and the Pyramid of the Moon, linked by the Avenue of the Dead. Its builders remain unknown, and later Aztecs gave the ruins their names.","u":0,"lat":19.6925,"lon":-98.8438},{"id":"a-cholula","c":"anc","t":"Great Pyramid of Cholula","s":"Puebla, Mexico, about 300 BC to AD 800","d":"The largest pyramid in the world by volume, now a grass-covered hill topped by a Spanish colonial church.","u":0,"lat":19.0578,"lon":-98.302},{"id":"a-chichen","c":"anc","t":"Chichén Itzá","s":"Yucatán, Mexico, about AD 600 to 1200","d":"A Maya city whose stepped pyramid, El Castillo, casts a serpent-shaped shadow down its stairs at the spring and fall equinoxes.","u":0,"lat":20.6843,"lon":-88.5678},{"id":"a-palenque","c":"anc","t":"Palenque and Pakal's tomb","s":"Chiapas, Mexico, about AD 683","d":"A Maya city whose Temple of the Inscriptions holds the tomb of King Pakal. In the 1960s Erich von Däniken claimed the carved lid shows an astronaut at the controls of a spacecraft. Mayanists read it as Pakal falling into the underworld beneath the world tree, a common Maya theme.","u":0,"lat":17.4838,"lon":-92.0463},{"id":"a-tikal","c":"anc","t":"Tikal","s":"Petén, Guatemala, about AD 200 to 900","d":"One of the largest Maya cities, with temple pyramids rising above the rainforest canopy.","u":0,"lat":17.222,"lon":-89.6237},{"id":"a-caral","c":"anc","t":"Caral","s":"Supe Valley, Peru, about 2600 BC","d":"One of the oldest cities in the Americas, with large platform pyramids built around the same time as Egypt's Great Pyramid.","u":0,"lat":-10.8932,"lon":-77.5205},{"id":"a-tiwanaku","c":"anc","t":"Tiwanaku and Puma Punku","s":"Near Lake Titicaca, Bolivia, about AD 500 to 1000","d":"The Akapana pyramid and the precisely cut stone blocks of Puma Punku. Ancient-astronaut writers cite the stonework as beyond ancient skill, but archaeologists have documented the Tiwanaku culture's tools, quarries, and techniques.","u":0,"lat":-16.5617,"lon":-68.6795},{"id":"a-nazca","c":"anc","t":"Nazca Lines","s":"Nazca Desert, Peru, about 500 BC to AD 500","d":"Giant figures and lines scraped into the desert floor, best seen from the air. Von Däniken suggested they were alien landing strips. Archaeologists link them to ritual walking paths and water ceremonies of the Nazca people.","u":0,"lat":-14.739,"lon":-75.13},{"id":"a-cahokia","c":"anc","t":"Cahokia's Monks Mound","s":"Collinsville, Illinois, about AD 900 to 1200","d":"The largest earthen pyramid in North America, built by the Mississippian culture at a city that was once larger than London at the time.","u":0,"lat":38.6604,"lon":-90.062},{"id":"a-xian","c":"anc","t":"Xi'an pyramids","s":"Shaanxi, China, about 200 BC to AD 200","d":"Flat-topped earthen burial mounds of Han dynasty emperors. After World War II, stories spread of a giant \"White Pyramid\" spotted by an American pilot. The famous photo turned out to show the Maoling mausoleum, a known tomb.","u":0,"lat":34.3378,"lon":108.5683},{"id":"a-gobekli","c":"anc","t":"Göbekli Tepe","s":"Şanlıurfa, Turkey, about 9500 BC","d":"Carved stone pillars arranged in rings, built by hunter-gatherers some 6,000 years before Stonehenge. It is not a pyramid, but it rewrote ideas about how early monumental building began.","u":0,"lat":37.2231,"lon":38.9225},{"id":"a-padang","c":"anc","t":"Gunung Padang","s":"West Java, Indonesia","d":"A terraced stone site on a hilltop. DISPUTED: a 2023 study claimed parts were built more than 20,000 years ago, making it the world's oldest pyramid, but the journal retracted the paper in 2024 because the dated soil showed no sign of human work.","u":0,"lat":-6.993,"lon":107.056},{"id":"a-bosnia","c":"anc","t":"Bosnian \"pyramids\"","s":"Visoko, Bosnia and Herzegovina","d":"DISPUTED: since 2005, businessman Semir Osmanagić has promoted Visočica hill as the world's largest pyramid. Geologists and archaeologists say the hills are natural formations, and European archaeology groups have called the project a hoax.","u":0,"lat":43.9775,"lon":18.1764},{"id":"m-pentagon","c":"gov","t":"The Pentagon","s":"Arlington, VA","d":"Headquarters of the Department of Defense. AARO operates here under the Deputy Secretary of Defense.","u":0,"lat":38.8705,"lon":-77.0541},{"id":"m-whitehouse","c":"gov","t":"The White House","s":"Washington, DC","d":"Office of the President, at the top of the executive branch.","u":0,"lat":38.8987,"lon":-77.035},{"id":"m-capitol","c":"gov","t":"U.S. Capitol","s":"Washington, DC","d":"Home of Congress, where the Armed Services, Intelligence, and Oversight committees hold UAP hearings and write UAP law.","u":0,"lat":38.8901,"lon":-77.0081},{"id":"m-odni","c":"gov","t":"ODNI headquarters","s":"Liberty Crossing, McLean, VA","d":"Office of the Director of National Intelligence, which co-produces the annual UAP reports with AARO.","u":0,"lat":38.9459,"lon":-77.1684},{"id":"m-cia","c":"gov","t":"CIA headquarters","s":"Langley, VA","d":"The Central Intelligence Agency, part of the intelligence community that feeds UAP reporting.","u":0,"lat":38.9519,"lon":-77.1493},{"id":"m-dia","c":"gov","t":"DIA headquarters","s":"Joint Base Anacostia-Bolling, DC","d":"Defense Intelligence Agency, which funded AAWSAP and is tied to AATIP.","u":0,"lat":38.8421,"lon":-77.015},{"id":"m-oni","c":"gov","t":"Office of Naval Intelligence","s":"Suitland, MD","d":"National Maritime Intelligence Center, where ONI supported the Navy-led UAP Task Force.","u":0,"lat":38.8428,"lon":-76.9332},{"id":"m-nasahq","c":"gov","t":"NASA headquarters","s":"Washington, DC","d":"Sponsored the 2022 to 2023 UAP independent study team.","u":0,"lat":38.8824,"lon":-77.016},{"id":"m-nro","c":"gov","t":"National Reconnaissance Office","s":"Chantilly, VA","d":"Builds and operates U.S. spy satellites for the intelligence community.","u":0,"lat":38.8815,"lon":-77.4476},{"id":"m-bragg","c":"mil","t":"Fort Bragg","s":"North Carolina","d":"One of the largest Army installations in the world, home of the XVIII Airborne Corps.","u":0,"lat":35.1398,"lon":-79.0037},{"id":"m-hood","c":"mil","t":"Fort Hood","s":"Texas","d":"Major Army armor and III Armored Corps pos al aviation.","u":0,"lat":30.3518,"lon":-87.3215},{"id":"m-whidbey","c":"mil","t":"NAS Whidbey Island","s":"Washington","d":"Navy electronic-attack aircraft base.","u":0,"lat":48.3531,"lon":-122.6547},{"id":"m-fallon","c":"mil","t":"NAS Fallon","s":"Nevada","d":"Home of TOPGUN, the Navy's fighter weapons school.","u":0,"lat":39.4154,"lon":-118.6994},{"id":"m-chinalake","c":"mil","t":"NAWS China Lake","s":"California","d":"Navy weapons research and test center.","u":0,"lat":35.6846,"lon":-117.691},{"id":"m-lemoore","c":"mil","t":"NAS Lemoore","s":"California","d":"The Navy's largest master jet base.","u":0,"lat":36.3331,"lon":-119.9517},{"id":"m-greatlakes","c":"mil","t":"Naval Station Great Lakes","s":"Illinois","d":"The Navy's only boot camp.","u":0,"lat":42.31,"lon":-87.8497},{"id":"m-kingsbay","c":"mil","t":"Naval Submarine Base Kings Bay","s":"Georgia","d":"Home port of Atlantic ballistic-missile submarines.","u":0,"lat":30.7969,"lon":-81.5144},{"id":"m-newlondon","c":"mil","t":"Naval Submarine Base New London","s":"Connecticut","d":"The Navy's primary East Coast submarine base.","u":0,"lat":41.3908,"lon":-72.0888},{"id":"m-pearl","c":"mil","t":"Joint Base Pearl Harbor-Hickam","s":"Hawaii","d":"Headquarters of the U.S. Pacific Fleet.","u":0,"lat":21.3505,"lon":-157.9505},{"id":"m-patuxent","c":"mil","t":"NAS Patuxent River","s":"Maryland","d":"Navy aircraft test center.","u":0,"lat":38.2883,"lon":-76.4139},{"id":"m-lejeune","c":"mil","t":"Camp Lejeune","s":"North Carolina","d":"Largest Marine Corps base on the East Coast.","u":0,"lat":34.6824,"lon":-77.3514},{"id":"m-pendleton","c":"mil","t":"Camp Pendleton","s":"California","d":"Main West Coast Marine Corps base.","u":0,"lat":33.3836,"lon":-117.5651},{"id":"m-29palms","c":"mil","t":"MCAGCC Twentynine Palms","s":"California","d":"The Marine Corps' largest training range.","u":0,"lat":34.2367,"lon":-116.0562},{"id":"m-parris","c":"mil","t":"MCRD Parris Island","s":"South Carolina","d":"Marine Corps recruit depot.
