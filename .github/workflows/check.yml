# Runs Watcher's automatic check (tools/check.mjs) on every pull request and every push to main.
# It only reads the repository; it doesn't build, deploy or change anything.
name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check.mjs
